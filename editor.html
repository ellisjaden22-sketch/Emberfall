function togLay(k){ LAY[k].v=LAY[k].v?0:1; if(!LAY[k].v&&ED[k]) for(const o of [...sel]) if(ED[k].includes(o)) sel.delete(o); savePrefs(); draw(); buildViewBtns(); renderLeft(); }
const MENUS=[['File',['new','open','loadLive','|','saveVer','versions','rename','|','preview','publish','backup','|','realm','getEditor']],
 ['Edit',['undo','redo','|','cut','copy','paste','dup','del','|','selAll','selNone','|','rot','rotB','|','find','palette']],
 ['View',['panelL','panelR','panelB','autoTab','|','fit','town','frame','goto','|','zin','zout','z100','|','tGrid','tTint','tBorders','tBase','tLabels','tMini']],
 ['Tools',[...TOOLS.filter(t=>t!=='|').map(t=>'tool_'+t.id),'|','tSnap']],
 ['World',['check','changes','history','output','|','preview','publish','|','realm']],
 ['Help',['welcome','keys','|','palette']]];
const checked=id=>({tGrid:LAY.grid.v,tTint:LAY.tint.v,tBorders:LAY.borders.v,tBase:LAY.base.v,tLabels:LAY.labels.v,tMini:ST.minimap,tSnap:ST.snap,panelL:ST.showL,panelR:ST.showR,panelB:ST.showB,autoTab:ST.autoTab})[id];
function buildMenus(){ const m=$('menus'); m.innerHTML=MENUS.map(([n],i)=>`<div class="menu" data-m="${i}"><button>${n}</button><div class="drop"></div></div>`).join('');
  m.querySelectorAll('.menu').forEach(el=>{ const fill=()=>{ el.querySelector('.drop').innerHTML=MENUS[+el.dataset.m][1].map(id=>{ if(id==='|') return '<div class="msep"></div>'; const c=CMDS[id], ck=checked(id), dis=(id==='undo'&&!undo.length)||(id==='redo'&&!redo.length)||(['cut','copy','dup','del','frame'].includes(id)&&!sel.size)||(id==='paste'&&!clip);
      return `<div class="mi ${dis?'dis':''}" data-c="${id}"><span class="chk">${ck===undefined?(c.tool&&ST.tool===c.id.slice(5)?I('check','s'):''):ck?I('check','s'):''}</span>${esc(c.name)}<span class="k">${keyLabel(c.key)}</span></div>`; }).join('');
      el.querySelectorAll('.mi').forEach(mi=>mi.onclick=()=>{ closeMenus(); CMDS[mi.dataset.c].run(); }); };
    el.querySelector('button').onclick=e=>{ e.stopPropagation(); const was=el.classList.contains('open'); closeMenus(); if(!was){ fill(); el.classList.add('open'); } };
    el.querySelector('button').onmouseenter=()=>{ if(document.querySelector('.menu.open')&&!el.classList.contains('open')){ closeMenus(); fill(); el.classList.add('open'); } }; }); }
function closeMenus(){ document.querySelectorAll('.menu.open').forEach(m=>m.classList.remove('open')); }
addEventListener('pointerdown',e=>{ if(!e.target.closest('.menu')) closeMenus(); if(!e.target.closest('#ctx')) hideCtx(); });

/* keyboard */
addEventListener('keydown',e=>{ if(!W||dlgOpen) return; const typing=/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName), mod=e.ctrlKey||e.metaKey, k=e.key, kl=k.toLowerCase();
  if(mod&&kl==='s'){ e.preventDefault(); return CMDS.saveVer.run(); } if(mod&&kl==='e'){ e.preventDefault(); return publishDlg(); } if(mod&&kl==='p'){ e.preventDefault(); return preview(); }
  if(mod&&kl==='b'){ e.preventDefault(); return togglePanel('L'); } if(mod&&kl==='j'){ e.preventDefault(); return togglePanel('B'); } if(mod&&kl==='i'){ e.preventDefault(); return togglePanel('R'); }
  if(mod&&kl==='f'){ e.preventDefault(); return quickOpen(''); } if(mod&&kl==='k'){ e.preventDefault(); return quickOpen('>'); } if(mod&&kl==='g'){ e.preventDefault(); return CMDS.goto.run(); } if(mod&&kl==='o'){ e.preventDefault(); return CMDS.open.run(); }
  if(typing){ if(k==='Escape') document.activeElement.blur(); return; }
  if(mod&&kl==='z'){ e.preventDefault(); return e.shiftKey?doRedo():doUndo(); } if(mod&&kl==='y'){ e.preventDefault(); return doRedo(); }
  if(mod&&kl==='c'){ e.preventDefault(); return copySel(); } if(mod&&kl==='x'){ e.preventDefault(); return copySel(true); } if(mod&&kl==='v'){ e.preventDefault(); return startPaste(); }
  if(mod&&kl==='d'){ e.preventDefault(); return duplicateSel(); } if(mod&&kl==='a'){ e.preventDefault(); return selectAll(); } if(mod&&k==='\''){ e.preventDefault(); return togLay('grid'); }
  if(mod) return;
  if(k===' '){ e.preventDefault(); if(!spaceDown){ spaceDown=true; cv.style.cursor='grab'; } return; }
  if(k==='Escape'){ hideCtx(); if(pasteMode){ pasteMode=false; setTool('select'); return; } if(drag&&drag.k!=='pan'){ if(pending){ restore(pending.s); pending=null; } drag=null; draw(); return; } if(sel.size||selRect){ selRect=null; setSel([]); } else if(ST.tool!=='select') setTool('select'); return; }
  if(k==='Delete'||k==='Backspace'){ e.preventDefault(); return deleteSel(); }
  if(k.startsWith('Arrow')&&sel.size){ e.preventDefault(); const s=e.shiftKey?5:1; return nudge(k==='ArrowLeft'?-s:k==='ArrowRight'?s:0,k==='ArrowUp'?-s:k==='ArrowDown'?s:0); }
  if(k.startsWith('Arrow')){ e.preventDefault(); const s=(e.shiftKey?240:80)/VIEW.z; VIEW.x+=k==='ArrowLeft'?-s:k==='ArrowRight'?s:0; VIEW.y+=k==='ArrowUp'?-s:k==='ArrowDown'?s:0; return draw(); }
  if(k==='['||k===']'){ ST.brush=clamp(ST.brush+(k===']'?1:-1),1,15); savePrefs(); buildOptbar(); return draw(); }
  if(k==='+'||k==='='){ return zoomAt(1.4); } if(k==='-'||k==='_'){ return zoomAt(1/1.4); } if(k==='Home'){ return fitMap(); } if(k==='?'){ return shortcutsDlg(); }
  if(kl==='r'){ return rotateSel(e.shiftKey?-Math.PI/4:Math.PI/4); } if(kl==='f'&&!e.shiftKey){ return sel.size?frameSel():null; } if(kl==='t'){ return CMDS.town.run(); } if(kl==='z'){ return togLay('tint'); } if(k==='1'){ return CMDS.z100.run(); }
  if(kl==='x'&&['brush','line','rect','fill'].includes(ST.tool)){ ST.layer=ST.layer==='zone'?'tile':'zone'; savePrefs(); buildOptbar(); renderTop(); return draw(); }
  const t=TOOLS.find(t=>t!=='|'&&t.key.toLowerCase()===kl); if(t) setTool(t.id); });
addEventListener('keyup',e=>{ if(e.key===' '){ spaceDown=false; if(!drag) cv.style.cursor=ST.tool==='pan'?'grab':ST.tool==='select'?'default':'crosshair'; } });
addEventListener('blur',()=>{ spaceDown=false; });

/* ---------- right-click menu ---------- */
function openCtx(cx,cy,x,y){ const o=pick(x,y), tx=Math.floor(x), ty=Math.floor(y); if(o&&!sel.has(o)){ if(ST.tool!=='select') setTool('select'); setSel([o]); }
  const items=[]; const it=(n,f,k,dis)=>items.push({n,f,k,dis});
  if(sel.size){ it(sel.size>1?`${sel.size} objects`:objName([...sel][0]),null,null,true); it('Properties',()=>focusField('iName')); it('Duplicate',()=>duplicateSel(),MOD+'+D'); it('Copy',()=>copySel(),MOD+'+C'); it('Cut',()=>copySel(true),MOD+'+X'); if([...sel].some(q=>ED.props.includes(q))) it('Rotate 45°',()=>rotateSel(Math.PI/4),'R'); it('Zoom to',frameSel,'F'); it('Delete',deleteSel,'Del'); items.push('|'); }
  if(clip) it('Paste here',()=>pasteAt(tx-Math.floor(clip.w/2),ty-Math.floor(clip.h/2)),MOD+'+V');
  if(inMap(tx,ty)){ it(`Pick ground here (${TDESC[tileAt(tx,ty)]||tileAt(tx,ty)})`,()=>eyedrop(tx,ty,true)); it('Add NPC here',()=>{ begin('Add NPC'); const n={name:uniqueName('New villager'),title:'',x:tx,y:ty,col:NPCCOL[ED.npcs.length%NPCCOL.length],say:''}; ED.npcs.push(n); end(); setTool('select'); setSel([n]); focusField('iName'); });
    it(`Add ${mobName(ST.mob)} ×${ST.n} here`,()=>{ begin('Add '+mobName(ST.mob)); ED.spawns.push({mob:ST.mob,x:tx,y:ty,n:ST.n}); end(); }); it('Add landmark here',()=>{ begin('Add landmark'); const p={name:'New landmark',x:tx,y:ty,r:5}; ED.pois.push(p); end(); setTool('select'); setSel([p]); focusField('iName'); });
    items.push('|'); it(`Copy coordinates (${tx}, ${ty})`,()=>{ navigator.clipboard&&navigator.clipboard.writeText(`${tx}, ${ty}`); toast('Copied '+tx+', '+ty); }); }
  const c=document.createElement('div'); c.id='ctx'; c.innerHTML=items.map((m,i)=>m==='|'?'<div class="msep"></div>':m.dis?`<div class="mi head">${esc(m.n)}</div>`:`<div class="mi" data-i="${i}"><span>${esc(m.n)}</span><span class="k">${m.k||''}</span></div>`).join('');
  hideCtx(); document.body.appendChild(c); const r=c.getBoundingClientRect(); c.style.left=Math.min(cx,innerWidth-r.width-6)+'px'; c.style.top=Math.min(cy,innerHeight-r.height-6)+'px';
  c.querySelectorAll('.mi[data-i]').forEach(e=>e.onclick=()=>{ const m=items[+e.dataset.i]; hideCtx(); if(m.f) m.f(); }); }
function hideCtx(){ const c=$('ctx'); if(c) c.remove(); }

/* ---------- find and the command palette ---------- */
function quickOpen(init){ const o=document.createElement('div'); o.className='ovl'; o.innerHTML=`<div class="dlg qo"><div class="qi">${I(init==='>'?'cmd':'search')}<input type="text" id="qoIn" placeholder="Find an NPC, landmark, zone, monster or x, y   ·   type > for commands" value="${esc(init)}"></div><div class="res" id="qoRes"></div></div>`;
  document.body.appendChild(o); dlgOpen++; const inp=o.querySelector('#qoIn'), res=o.querySelector('#qoRes'); let items=[], cur=0;
  const close=()=>{ o.remove(); dlgOpen--; };
  const search=()=>{ const q=inp.value.trim(), ql=q.replace(/^>/,'').trim().toLowerCase(); items=[];
    if(q.startsWith('>')){ for(const c of Object.values(CMDS)) if(!ql||c.name.toLowerCase().includes(ql)) items.push({ic:I('cmd','s'),n:c.name,k:keyLabel(c.key),run:c.run}); }
    else { const m=q.match(/^(\d+)\s*[, ]\s*(\d+)$/); if(m) items.push({ic:I('target','s'),n:`Go to ${m[1]}, ${m[2]}`,k:'',run:()=>centerOn(+m[1]+.5,+m[2]+.5,Math.max(VIEW.z,10))});
      const has=s=>String(s||'').toLowerCase().includes(ql);
      if(ql){ for(const k of ['npcs','pois','spawns','props']) for(const x of ED[k]) if(has(objName(x,k))||(k==='npcs'&&has(x.title))) items.push({ic:I(KIC[k],'s'),n:objName(x,k),k:`yours · ${Math.floor(x.x)}, ${Math.floor(x.y)}`,run:()=>{ setTool('select'); setSel([x]); frameSel(); }});
        for(const n of W.npcs) if(has(n.name)||has(n.title)) items.push({ic:I('tag','s'),n:n.name+(n.title?' ‹'+n.title+'›':''),k:`NPC · ${n.x}, ${n.y}`,run:()=>centerOn(n.x+.5,n.y+.5,14)});
        for(const p of W.pois) if(has(p.name)) items.push({ic:I('target','s'),n:p.name,k:`landmark · ${p.x}, ${p.y}`,run:()=>centerOn(p.x+.5,p.y+.5,10)});
        for(const z in W.zones) if(has(W.zones[z])){ let sx=0,sy=0,c=0; for(let i=0;i<W.MW*W.OWH;i+=7) if(W.zmap[i]===z){ sx+=i%W.MW; sy+=Math.floor(i/W.MW); c++; } if(c) items.push({ic:I('zones','s'),n:W.zones[z],k:'zone',run:()=>centerOn(sx/c,sy/c,4)}); }
        const seen=new Set(); for(const mt of W.mobTypes) if(has(mt.name)&&!seen.has(mt.key)){ seen.add(mt.key); const L=W.mobs.filter(q=>q[0]===mt.key); if(L.length) items.push({ic:I('warn','s'),n:mt.name,k:`${L.length} in the world · Lv ${mt.lv[0]}–${mt.lv[1]}`,run:()=>{ const q=L[(quickOpen.cyc=(quickOpen.cyc||0)+1)%L.length]; centerOn(q[1]+.5,q[2]+.5,12); }}); } }
      else items.push({ic:I('info','s'),n:'Type a name, or x, y to jump there. Start with > for commands.',k:'',run:null}); }
    items=items.slice(0,80); cur=Math.min(cur,Math.max(0,items.length-1));
    res.innerHTML=items.map((it,i)=>`<div class="tr ${i===cur?'on':''}" data-i="${i}"><span class="gl">${it.ic}</span><span class="nm">${esc(it.n)}</span><span class="xy">${esc(it.k)}</span></div>`).join('')||'<div class="empty">Nothing found.</div>';
    res.querySelectorAll('.tr').forEach(r=>{ r.onclick=()=>go(+r.dataset.i); r.onmousemove=()=>{ if(cur!==+r.dataset.i){ cur=+r.dataset.i; res.querySelectorAll('.tr').forEach(x=>x.classList.toggle('on',+x.dataset.i===cur)); } }; }); };
  const go=i=>{ const it=items[i]; if(!it||!it.run) return; close(); it.run(); };
  inp.oninput=()=>{ cur=0; search(); }; inp.onkeydown=e=>{ if(e.key==='Escape'){ e.stopPropagation(); close(); } else if(e.key==='ArrowDown'||e.key==='ArrowUp'){ e.preventDefault(); cur=clamp(cur+(e.key==='ArrowDown'?1:-1),0,items.length-1); search(); const r=res.querySelector('.tr.on'); if(r) r.scrollIntoView({block:'nearest'}); } else if(e.key==='Enter'){ e.preventDefault(); go(cur); } };
  o.addEventListener('mousedown',e=>{ if(e.target===o) close(); }); search(); inp.focus(); inp.setSelectionRange(inp.value.length,inp.value.length); }

/* ===================== files, versions, the realm, preview and publishing ===================== */
function download(name,text,type){ const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([text],{type})); a.download=name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),3000); }
const worldJs=()=>`/* Emberfall world edits, made with the World Editor on ${new Date().toISOString().slice(0,10)}.\n   Upload this file to your GitHub repository next to index.html, or use Publish in the editor. */\nwindow.WORLD_EDITS=${JSON.stringify(exportData())};\n`;
const parseWorld=txt=>{ const i=txt.indexOf('{'), j=txt.lastIndexOf('}'); if(i<0||j<i) throw new Error('no data'); const d=JSON.parse(txt.slice(i,j+1)); if(!d||typeof d!=='object') throw new Error('no data'); return d; };
const summary=d=>`${(d.tiles||[]).length} painted tiles, ${(d.zones||[]).length} zone cells, ${(d.props||[]).length} props, ${(d.npcs||[]).length} NPCs, ${(d.spawns||[]).length} monster groups and ${(d.pois||[]).length} landmarks`;
async function importWorld(d,from){ if(!editCount()){ begin('Open '+from); loadData(d,'replace',true); end(); toast('Opened '+from,'ok'); return; }
  const v=await dlg({title:'Open '+from,html:`<p>This file has ${summary(d)}.</p><p>You already have ${editCount()} changes in the editor. Replace them, or add this file's edits to yours?</p>`,buttons:[{t:'Cancel',v:null},{t:'Add to mine',v:'merge'},{t:'Replace mine',v:'replace',pri:1}]});
  if(!v) return; begin(v==='merge'?'Merge '+from:'Open '+from); loadData(d,v,true); end(); toast(v==='merge'?'Added the edits from '+from:'Opened '+from,'ok'); }
$('fOpen').onchange=async e=>{ const f=e.target.files[0]; e.target.value=''; if(!f) return; try{ await importWorld(parseWorld(await f.text()),f.name); }catch(err){ dlg({title:'Could not open the file',html:`<p>${esc(f.name)} is not an Emberfall world file (world.js or a .json backup).</p>`}); } };
addEventListener('dragover',e=>{ e.preventDefault(); }); addEventListener('drop',async e=>{ e.preventDefault(); const f=e.dataTransfer.files&&e.dataTransfer.files[0]; if(!f||!W) return; try{ await importWorld(parseWorld(await f.text()),f.name); }catch(err){ toast(f.name+' is not a world file',1); } });

/* ---------- the realm: the server this editor loads from, previews on and publishes to ---------- */
const DEFAULT_REALM='https://emberfall-sb6p.onrender.com';
const REALM={url:'',online:false,version:'',info:null};
function realmUrl(){ const s=LS.get('ef_editor_realm',''); if(s) return s.replace(/\/+$/,''); return /^https?:$/.test(location.protocol)?location.origin:DEFAULT_REALM; }
const realmHost=()=>realmUrl().replace(/^https?:\/\//,'');
const sameOrigin=()=>/^https?:$/.test(location.protocol)&&realmUrl()===location.origin;
async function fetchT(url,opt={},ms=8000){ const c=new AbortController(), t=setTimeout(()=>c.abort(),ms); try{ return await fetch(url,{...opt,signal:c.signal,cache:'no-store'}); } finally{ clearTimeout(t); } }
async function realmInit(){ REALM.url=realmUrl(); const el=$('stRealm'); $('stRealmT').textContent='Connecting…'; el.className='clk off';
  try{ const r=await fetchT(REALM.url+'/api/version'); const j=await r.json(); REALM.online=true; REALM.version=j.server||''; }catch(e){ REALM.online=false; REALM.version=''; }
  try{ const r=await fetchT(REALM.url+'/api/world/info'); REALM.info=r.ok?await r.json():null; }catch(e){ REALM.info=null; }
  el.className='clk '+(REALM.online?'on':'off'); $('stRealmT').textContent=REALM.online?realmHost():'Offline'; el.title=REALM.online?`Connected to ${REALM.url} (${REALM.version}). Click to change.`:`Can't reach ${REALM.url}. You can keep editing; publishing and preview need the realm. Click to change.`;
  logOut(REALM.online?`Connected to ${REALM.url} (server ${REALM.version}).`:`Could not reach ${REALM.url}. Working offline.`,REALM.online?'ok':'warn');
  const b=$('banner'); b.classList.add('hidden');
  if(REALM.online&&REALM.version&&W.game&&REALM.version!==W.game&&!LS.get('ef_editor_banner_'+REALM.version,0)){
    b.innerHTML=`${I('warn')}<span>Your realm runs <b>${esc(REALM.version)}</b>, but this editor's world is from <b>${esc(W.game)}</b>. If the map changed, get the newest editor.</span><button class="btn sm" id="bnGet">${I('dl','s')}Get newest</button><button class="ib sm" id="bnX">${I('x','s')}</button>`; b.classList.remove('hidden');
    $('bnGet').onclick=()=>window.open(REALM.url+'/editor','_blank'); $('bnX').onclick=()=>{ LS.set('ef_editor_banner_'+REALM.version,1); b.classList.add('hidden'); }; }
  if(ST.showR&&!sel.size) renderRight(); }
function realmDlg(){ dlg({title:'Realm',html:`<p>The realm is your Emberfall server. The editor works without it, but it needs it to load the live world, preview in game and publish.</p>
    ${prow('Address',`<input class="inp" id="rlU" placeholder="${DEFAULT_REALM}" value="${esc(LS.get('ef_editor_realm','')||realmUrl())}">`)}
    <div id="rlS" class="hint" style="margin-left:92px">${REALM.online?`<span style="color:var(--ok)">● Connected</span> · server ${esc(REALM.version)}`:'<span>● Not connected</span>'}</div>`,
  buttons:[{t:'Use default',v:'def'},{t:'Cancel',v:null},{t:'Connect',pri:1,get:o=>o.querySelector('#rlU').value.trim()}]}).then(v=>{ if(v==null) return; if(v==='def'){ LS.set('ef_editor_realm',''); } else { let u=v; if(u&&!/^https?:\/\//.test(u)) u='https://'+u; LS.set('ef_editor_realm',u===location.origin?'':u.replace(/\/+$/,'')); } realmInit(); }); }
async function loadLive(){ try{ const r=await fetchT(realmUrl()+'/play/world.js?t='+Date.now()); if(!r.ok) throw 0; const d=parseWorld(await r.text()); await importWorld(d,'the live world'); }
  catch(e){ dlg({title:'No live world',html:`<p>Could not read world.js from <b>${esc(realmHost())}</b>. Either the realm has no world.js yet (publish one first), or it can't be reached right now.</p>`}); } }
async function downloadEditor(){ if(!/^https?:$/.test(location.protocol)) return dlg({title:'You already have it',html:'<p>You opened this editor from a file on your computer, so it already works on its own. Keep that file somewhere handy, or get the newest one from your realm at <code>/editor</code>.</p>'});
  try{ const r=await fetchT(location.href.split('#')[0]); download('Emberfall World Editor.html',await r.text(),'text/html'); toast('Downloaded the editor. Double-click it to open it any time, even offline.','ok'); }catch(e){ toast('Could not download the editor',1); } }

/* ---------- versions: named snapshots kept in this browser ---------- */
async function saveVersion(){ const n=await askDlg('Save a version','Give this version a name so you can come back to it later:',`${LS.get('ef_editor_name','')||'World'} – ${new Date().toLocaleString([], {month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'})}`); if(!n) return;
  const V=LS.get('ef_editor_versions',[]); V.unshift({n:n.slice(0,60),t:Date.now(),d:exportData(),c:editCount()}); while(V.length>20) V.pop();
  if(!LS.set('ef_editor_versions',V)){ V.pop(); if(!LS.set('ef_editor_versions',V.slice(0,5))) return dlg({title:'Not enough room',html:'<p>This browser has no room left for more versions. Delete old versions, or use File › Download a backup.</p>'}); } saveDraft(); toast('Saved version "'+n+'"','ok'); }
function versionsDlg(){ const V=LS.get('ef_editor_versions',[]);
  const html=V.length?`<div class="tree">${V.map((v,i)=>`<div class="tr" style="height:44px;cursor:default">${I('save','s')}<span class="nm"><b>${esc(v.n)}</b><br><span style="color:var(--tx3)">${new Date(v.t).toLocaleString()} · ${v.c} changes</span></span><button class="btn sm" data-o="${i}">Open</button><button class="ib sm" data-d="${i}" data-tip="Delete">${I('trash','s')}</button></div>`).join('')}</div>`:'<p class="hint">No saved versions yet. Use File › Save a version (Ctrl+S) to keep a copy you can go back to.</p>';
  dlg({title:'Versions',html,buttons:[{t:'Close',v:null,pri:1}],onOpen:(o,close)=>{ o.querySelectorAll('[data-o]').forEach(b=>b.onclick=()=>{ const v=V[+b.dataset.o]; close(); begin('Open version '+v.n); loadData(v.d,'replace',true); end(); toast('Opened "'+v.n+'"','ok'); });
    o.querySelectorAll('[data-d]').forEach(b=>b.onclick=async()=>{ const v=V[+b.dataset.d]; close(); if(await confirmDlg('Delete version?',`Delete "${esc(v.n)}"? This cannot be undone.`,'Delete',1)){ V.splice(+b.dataset.d,1); LS.set('ef_editor_versions',V); } versionsDlg(); }); }}); }

/* ---------- preview in the game ---------- */
async function preview(){ const at=[Math.floor(VIEW.x),Math.floor(VIEW.y)], R=realmUrl();
  if(sameOrigin()){ if(!LS.set('ef_world_preview',exportData())) return dlg({title:'Preview too big',html:'<p>Your world is too big to hand to the game through browser storage. Publish it instead.</p>'});
    LS.set('ef_world_preview_at',at); window.open(R+'/play/index.html?preview=1','_blank'); toast('Opening the preview where the map is centred'); return; }
  // opened from disk or another site: hand the world to the realm, which gives it back to the game tab
  const w=window.open('about:blank','_blank'); try{ const r=await fetchT(R+'/api/world/preview',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({world:exportData(),at})},15000); const j=await r.json();
    if(!j.ok) throw new Error(j.msg||'failed'); if(w) w.location=R+'/play/index.html?preview='+j.id; else window.open(R+'/play/index.html?preview='+j.id,'_blank'); logOut('Preview opened on '+realmHost()+'.','ok'); }
  catch(e){ if(w) w.close(); dlg({title:'Preview needs the realm',html:`<p>Could not reach <b>${esc(realmHost())}</b> to start a preview${e.message&&e.message!=='failed'&&!/abort|fetch/i.test(e.message)?': '+esc(e.message):''}.</p><p>Check your connection, or set the right address in File › Realm settings.</p>`}); } }

/* ---------- what changed ---------- */
function showChanges(){ const byT={}, byZ={}; for(const k in ED.tiles){ byT[ED.tiles[k]]=(byT[ED.tiles[k]]||0)+1; } for(const k in ED.zones){ byZ[ED.zones[k]]=(byZ[ED.zones[k]]||0)+1; }
  const byP={}; for(const p of ED.props) byP[p.k]=(byP[p.k]||0)+1; const byM={}; for(const s of ED.spawns) byM[s.mob]=(byM[s.mob]||0)+s.n;
  const tbl=(o,f)=>Object.entries(o).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<div><span>${f(k)}</span><b class="mono">${v}</b></div>`).join('');
  dlg({title:'Everything you changed',wide:1,html:editCount()?`
    ${Object.keys(byT).length?`<h4>Painted ground</h4><div class="sc">${tbl(byT,k=>esc(TDESC[k]||k))}</div>`:''}
    ${Object.keys(byZ).length?`<h4>Zones</h4><div class="sc">${tbl(byZ,k=>esc(zoneName(k)))}</div>`:''}
    ${ED.props.length?`<h4>Props</h4><div class="sc">${tbl(byP,k=>(PROPS[k]||['?',k]).join(' '))}</div>`:''}
    ${ED.spawns.length?`<h4>Monsters</h4><div class="sc">${tbl(byM,k=>esc(mobName(k)))}</div>`:''}
    ${ED.npcs.length?`<h4>NPCs</h4><div class="sc">${ED.npcs.map(n=>`<div><span>${esc(n.name)}${n.title?' ‹'+esc(n.title)+'›':''}</span><b class="mono">${n.x}, ${n.y}</b></div>`).join('')}</div>`:''}
    ${ED.pois.length?`<h4>Landmarks</h4><div class="sc">${ED.pois.map(p=>`<div><span>${esc(p.name||'(no name)')}</span><b class="mono">${p.x}, ${p.y}</b></div>`).join('')}</div>`:''}`:'<p>You have not changed anything yet.</p>',buttons:[{t:'Close',v:null,pri:1}]}); }

/* ---------- publish ---------- */
async function publishDlg(){ runChecks(); const errs=problems.filter(p=>p.sev==='err'), warns=problems.filter(p=>p.sev==='warn'), R=realmUrl(); let info=null;
  try{ const r=await fetchT(R+'/api/world/info'); if(r.ok) info=await r.json(); }catch(e){}
  const canPub=info&&info.publish, gh=info&&info.github;
  const html=`<p>${summary(exportData())}.</p>
    ${errs.length?`<div class="note err">${I('err','s')}<span>${errs.length} problem${errs.length>1?'s':''} will stop part of your world from loading. <a href="#" id="pbProb" style="color:inherit">Show problems</a></span></div>`:warns.length?`<div class="note">${I('warn','s')}<span>${warns.length} warning${warns.length>1?'s':''}. <a href="#" id="pbProb" style="color:inherit">Show them</a></span></div>`:`<div class="note ok">${I('check','s')}<span>No problems found.</span></div>`}
    <div class="card"><div class="title">${I('upload','s')}Publish to ${esc(realmHost())}</div>
      ${canPub?`<p class="hint" style="margin-top:0">Everyone who opens or reloads the game gets your world straight away. Uses your owner password (the one for <code>/gm login</code>).</p>
      ${prow('Password','<input class="inp" type="password" id="pbPw" autocomplete="current-password">')}
      <label style="display:flex;gap:8px;align-items:flex-start;margin:10px 0 4px"><input type="checkbox" id="pbGh" ${gh?'checked':'disabled'} style="margin-top:2px"><span>Also save it to GitHub${info.repo?' (<span class="mono">'+esc(info.repo)+'</span>)':''} so it stays after the realm restarts. <span style="color:var(--tx3)">${gh?'Render redeploys afterwards, which restarts the realm for a moment.':'Needs a GitHub token on the server (WORLD_GITHUB_TOKEN).'}</span></span></label>
      <div class="acts"><button class="btn pri" id="pbGo">${I('upload','s')}Publish now</button></div><div id="pbOut" class="hint"></div>`
      :`<p class="hint" style="margin:0">${info?'Publishing is off because this realm has no <b>GM_PASSWORD</b>. Add one in Render › Environment.':`Can't reach the realm, or it is older than v0.97. Check the address in File › Realm settings.`}</p>`}</div>
    <div class="card"><div class="title">${I('dl','s')}Or upload it yourself</div><ol style="margin-bottom:6px"><li>Download <b>world.js</b>.</li><li>On GitHub, <b>Add file › Upload files</b> next to <code>index.html</code> and commit.</li><li>Render redeploys in 2–3 minutes.</li></ol>
      <div class="acts"><button class="btn" id="pbDl">${I('dl','s')}world.js</button><button class="btn" id="pbCopy">${I('copy','s')}Copy code</button><button class="btn" id="pbBk">${I('save','s')}Backup (.json)</button></div></div>`;
  dlg({title:'Publish world',wide:1,html,buttons:[{t:'Close',v:null}],onOpen:(o,close)=>{
    const pp=o.querySelector('#pbProb'); if(pp) pp.onclick=e=>{ e.preventDefault(); close(); showBot('prob'); };
    o.querySelector('#pbDl').onclick=()=>{ download('world.js',worldJs(),'text/javascript'); toast('Downloaded world.js','ok'); logOut('Downloaded world.js ('+summary(exportData())+').'); };
    o.querySelector('#pbCopy').onclick=()=>{ navigator.clipboard.writeText(worldJs()).then(()=>toast('Copied the world.js code','ok'),()=>toast('Copying is blocked here. Use Download instead.',1)); };
    o.querySelector('#pbBk').onclick=()=>CMDS.backup.run();
    const go=o.querySelector('#pbGo'); if(go){ const pw=o.querySelector('#pbPw'); pw.focus(); pw.onkeydown=e=>{ if(e.key==='Enter'){ e.preventDefault(); e.stopPropagation(); go.click(); } };
      go.onclick=async()=>{ const out=o.querySelector('#pbOut'); if(!pw.value){ out.innerHTML='<span style="color:var(--warn)">Type your password first.</span>'; return pw.focus(); }
        go.disabled=true; out.textContent='Publishing…';
        try{ const r=await fetchT(R+'/api/world/publish',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({pw:pw.value,world:exportData(),github:o.querySelector('#pbGh').checked,who:LS.get('ef_editor_name','')})},40000); const j=await r.json().catch(()=>({ok:false,msg:'The server answered '+r.status}));
          if(!j.ok){ out.innerHTML=`<span style="color:var(--err)">${esc(j.msg||'Publishing failed.')}</span>`; logOut('Publish failed: '+(j.msg||r.status),'err'); go.disabled=false; return; }
          pw.value=''; LS.set('ef_editor_published',{t:Date.now(),c:editCount(),sig:sig()}); updateDirty(); renderRight();
          out.innerHTML=`<span style="color:var(--ok)">Published. Your world is live: reload the game to see it.</span>${j.github?`<br><span style="color:${j.github.ok?'var(--ok)':'var(--warn)'}">${esc(j.github.msg)}</span>${j.github.commit?` <a href="${esc(j.github.commit)}" target="_blank" style="color:var(--ac)">View the commit</a>`:''}`:''}`;
          logOut(`Published to ${realmHost()} (${summary(exportData())}).`,'ok'); if(j.github) logOut('GitHub: '+j.github.msg,j.github.ok?'ok':'warn'); toast('Your world is live','ok'); go.disabled=false; }
        catch(e){ out.innerHTML='<span style="color:var(--err)">Could not reach the realm. Check your connection and try again.</span>'; logOut('Publish failed: could not reach '+realmHost(),'err'); go.disabled=false; } }; } }}); }

/* ---------- help ---------- */
function showWelcome(){ const V=LS.get('ef_editor_versions',[]).slice(0,3);
  dlg({title:'Emberfall World Editor',wide:1,html:`<div class="welcome"><div class="col"><h4>Start</h4>
    <div class="wl" data-w="cont">${I('map')}<div>Continue editing<small>${editCount()} changes in this browser</small></div></div>
    <div class="wl" data-w="open">${I('folder')}<div>Open a world file…<small>world.js or a .json backup</small></div></div>
    <div class="wl" data-w="live">${I('globe')}<div>Load the live world<small>from ${esc(realmHost())}</small></div></div>
    <div class="wl" data-w="new">${I('plus')}<div>New empty world<small>start with no changes</small></div></div>
    ${V.length?`<h4>Recent versions</h4>${V.map((v,i)=>`<div class="wl" data-v="${i}">${I('save')}<div>${esc(v.n)}<small>${new Date(v.t).toLocaleDateString()} · ${v.c} changes</small></div></div>`).join('')}`:''}</div>
   <div class="col"><h4>Get going</h4>
    <p class="hint" style="margin-top:0"><b style="color:var(--tx)">Move</b> with the right mouse button or Space-drag, zoom with the wheel. <kbd>${MOD}+F</kbd> finds anything.</p>
    <p class="hint"><b style="color:var(--tx)">Paint</b> ground and zones with <kbd>B</kbd> <kbd>L</kbd> <kbd>U</kbd> <kbd>G</kbd>. Pick what to paint in <b>Assets</b> on the left.</p>
    <p class="hint"><b style="color:var(--tx)">Place</b> props <kbd>P</kbd>, NPCs <kbd>N</kbd>, monsters <kbd>M</kbd> and landmarks <kbd>K</kbd>. Edit them in the <b>Inspector</b>.</p>
    <p class="hint"><b style="color:var(--tx)">Ship it:</b> fix anything in <b>Problems</b>, <kbd>${MOD}+P</kbd> to preview, <kbd>${MOD}+E</kbd> to publish.</p>
    <p class="hint">${/^https?:$/.test(location.protocol)?'Tip: File › Download this editor gives you a copy that opens straight from your computer.':'You are running the editor from a file. It works offline; it connects to your realm only to preview and publish.'}</p></div></div>`,
   buttons:[{t:'Keyboard shortcuts',v:'k'},{t:'Start',v:null,pri:1}],onOpen:(o,close)=>{ o.querySelectorAll('[data-w]').forEach(e=>e.onclick=()=>{ close(); ({open:()=>CMDS.open.run(),live:loadLive,new:()=>CMDS.new.run(),cont:()=>{}})[e.dataset.w](); });
     o.querySelectorAll('[data-v]').forEach(e=>e.onclick=()=>{ const v=V[+e.dataset.v]; close(); begin('Open version '+v.n); loadData(v.d,'replace',true); end(); toast('Opened "'+v.n+'"','ok'); }); }}).then(v=>{ if(v==='k') shortcutsDlg(); }); }
function shortcutsDlg(){ const L=[['Move the map','Right-drag · Space-drag · Arrows'],['Zoom','Wheel · + / −'],['Whole map / town','Home / T'],['Zoom to selection','F'],['Find / commands',MOD+'+F / '+MOD+'+K'],['Go to x, y',MOD+'+G'],
   ...TOOLS.filter(t=>t!=='|').map(t=>[t.name+' tool',t.key]),['Brush size','[ / ]'],['Ground ↔ zone painting','X'],['Pick ground (painting tools)','Alt+click'],['Rotate props','R / Shift+R'],['Nudge selection','Arrows (Shift: 5)'],['Add to selection','Shift+click'],['Copy while moving','Alt+drag'],
   ['Undo / redo',MOD+'+Z / '+(isMac?MOD+'+Shift+Z':MOD+'+Y')],['Copy / cut / paste',MOD+'+C / X / V'],['Duplicate',MOD+'+D'],['Select all',MOD+'+A'],['Delete','Del'],['Cancel / deselect','Esc'],['Zone colours','Z'],['Grid',MOD+"+'"],
   ['Left / bottom / right panel',MOD+'+B / J / I'],['Save version',MOD+'+S'],['Preview',MOD+'+P'],['Publish',MOD+'+E']];
  dlg({title:'Keyboard shortcuts',wide:1,html:`<div class="sc">${L.map(([a,b])=>`<div><span>${a}</span><span>${b.split(' · ').map(x=>`<kbd>${esc(x)}</kbd>`).join(' ')}</span></div>`).join('')}</div>`,buttons:[{t:'Close',v:null,pri:1}]}); }
