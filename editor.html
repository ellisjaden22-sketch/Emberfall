<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Emberfall World Editor</title>
<link rel="icon" href="icon.png">
<style>
:root{--bg:#0e0a07;--p1:#16100b;--p2:#1d1610;--p3:#271d14;--line:#35281b;--line2:#4a3825;--gold:#f0bd55;--gold2:#ffd98a;--txt:#eadfca;--dim:#9c8b72;--dim2:#6f6250;--red:#ff6a5a;--amber:#ffb340;--green:#7ed17e;--blue:#6fb6ff;--sel:#ffd36a}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);font:13px/1.4 "Segoe UI",system-ui,-apple-system,sans-serif;overflow:hidden;user-select:none}
input,textarea,select,button{font:inherit;color:var(--txt)}
input[type=text],input[type=number],input[type=search],textarea,select{background:#0f0b08;border:1px solid var(--line2);border-radius:4px;padding:4px 7px;outline:none;min-width:0;user-select:text}
input:focus,textarea:focus,select:focus{border-color:var(--gold)}
textarea{resize:vertical;width:100%}
button{background:var(--p3);border:1px solid var(--line2);border-radius:4px;padding:4px 10px;cursor:pointer;white-space:nowrap}
button:hover{border-color:#8a6a3a;background:#30241a}button:disabled{opacity:.4;cursor:default}
button.pri{background:linear-gradient(#f6c862,#c98a26);color:#2a1604;border-color:#f6c862;font-weight:650}button.pri:hover{filter:brightness(1.08)}
button.on{background:#4a3416;border-color:var(--gold);color:#fff}
button.ghost{background:none;border-color:transparent}button.ghost:hover{background:#ffffff10;border-color:transparent}
button.danger:hover{border-color:var(--red);color:#ffb0a8}
input[type=range]{accent-color:var(--gold);min-width:60px}input[type=color]{width:46px;height:26px;padding:2px;background:#0f0b08;border:1px solid var(--line2);border-radius:4px;cursor:pointer}input[type=checkbox]{accent-color:var(--gold)}
kbd{display:inline-block;background:#0f0b08;border:1px solid var(--line2);border-bottom-width:2px;border-radius:3px;padding:0 5px;font:11px/16px ui-monospace,Consolas,monospace;color:var(--txt)}
.ico{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
/* layout */
#app{display:grid;grid-template-rows:34px 38px 1fr 24px;grid-template-columns:46px 1fr var(--rw,310px);height:100%}
#menubar{grid-column:1/-1;display:flex;align-items:center;gap:2px;padding:0 8px;background:linear-gradient(#21180f,#18110b);border-bottom:1px solid var(--line)}
#menubar .logo{font:700 14px Georgia,serif;color:var(--gold);margin-right:12px;display:flex;align-items:center;gap:7px;white-space:nowrap}
#menubar .logo b{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:4px;background:linear-gradient(#f6c862,#a8661a);color:#2a1604;font:700 12px sans-serif}
.menu{position:relative}.menu>button{background:none;border:0;padding:5px 10px;border-radius:4px}.menu>button:hover,.menu.open>button{background:#ffffff12}
.drop{position:absolute;left:0;top:100%;min-width:260px;background:var(--p2);border:1px solid var(--line2);border-radius:6px;padding:4px;box-shadow:0 10px 30px #000a;z-index:50;display:none}
.menu.open .drop{display:block}
.mi{display:flex;align-items:center;gap:10px;padding:5px 10px;border-radius:4px;cursor:pointer;white-space:nowrap}.mi:hover{background:#4a3416}.mi .k{margin-left:auto;color:var(--dim);font-size:11.5px}.mi.dis{opacity:.4;pointer-events:none}
.mi .chk{width:14px;text-align:center;color:var(--gold)}
.msep{height:1px;background:var(--line);margin:4px 2px}
#menubar .sp{flex:1}#menubar .qb{display:flex;gap:6px;align-items:center}
#docname{color:var(--dim);font-size:12px;margin-right:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:260px}
#optbar{grid-column:1/-1;display:flex;align-items:center;gap:14px;padding:0 12px;background:var(--p1);border-bottom:1px solid var(--line);overflow-x:auto;overflow-y:hidden;white-space:nowrap}
#optbar .tname{font-weight:650;color:var(--gold2);display:flex;align-items:center;gap:6px;min-width:110px}
#optbar label{display:flex;align-items:center;gap:6px;color:var(--dim)}#optbar label b{color:var(--txt);font-weight:600;min-width:22px}
#optbar .seg{display:flex}#optbar .seg button{border-radius:0;padding:3px 9px}#optbar .seg button:first-child{border-radius:4px 0 0 4px}#optbar .seg button:last-child{border-radius:0 4px 4px 0}#optbar .seg button+button{margin-left:-1px}
#optbar .vs{width:1px;height:20px;background:var(--line2)}
#toolbar{background:var(--p1);border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;padding:6px 0;gap:3px;overflow-y:auto}
#toolbar button{width:36px;height:34px;padding:0;display:grid;place-items:center;background:none;border-color:transparent;color:#cdbb9c;position:relative}
#toolbar button:hover{background:#ffffff10}#toolbar button.on{background:#4a3416;border-color:var(--gold);color:#fff}
#toolbar .tsep{width:26px;height:1px;background:var(--line2);margin:4px 0}
#view{position:relative;overflow:hidden;background:#080604}
#cv{display:block;width:100%;height:100%;touch-action:none}
#mini{position:absolute;right:10px;bottom:10px;border:1px solid var(--line2);border-radius:4px;background:#000;box-shadow:0 4px 14px #0009;cursor:pointer}
#zoombox{position:absolute;right:10px;top:10px;display:flex;gap:2px;background:#16100bd8;border:1px solid var(--line2);border-radius:6px;padding:3px;align-items:center}
#zoombox button{padding:2px 8px;background:none;border-color:transparent}#zoombox button:hover{background:#ffffff14}#zoombox span{min-width:46px;text-align:center;color:var(--dim);font-size:12px}
#hoverTip{position:absolute;pointer-events:none;background:#000c;border:1px solid var(--line2);border-radius:4px;padding:3px 8px;font-size:12px;display:none;white-space:nowrap;z-index:3}
#side{background:var(--p1);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0;position:relative}
#side .split{position:absolute;left:-3px;top:0;bottom:0;width:6px;cursor:ew-resize;z-index:2}
.pane{display:flex;flex-direction:column;min-height:0;border-bottom:1px solid var(--line)}#paneTop{flex:1 1 55%}#paneBot{flex:1 1 45%}
.tabs{display:flex;background:var(--p2);border-bottom:1px solid var(--line);flex:none}
.tabs button{flex:1;border:0;border-radius:0;background:none;padding:7px 4px;color:var(--dim);border-bottom:2px solid transparent;font-size:12.5px}
.tabs button.on{color:var(--txt);border-bottom-color:var(--gold);background:none}.tabs button .bd{display:inline-block;min-width:16px;padding:0 4px;border-radius:8px;background:#5a2a20;color:#ffd0c8;font-size:10.5px;margin-left:4px}
.tabs button .bd.ok{background:#24402a;color:#bfe8bf}
.body{flex:1;overflow:auto;padding:10px;min-height:0}
h4{margin:12px 0 6px;font:650 11px/1 sans-serif;letter-spacing:.8px;text-transform:uppercase;color:var(--dim)}h4:first-child{margin-top:2px}
.hint{color:var(--dim);font-size:12px;margin:6px 0}
.fld{display:grid;grid-template-columns:78px 1fr;align-items:center;gap:6px;margin:6px 0}.fld>span{color:var(--dim);font-size:12px}
.fld .two{display:flex;gap:6px}.fld .two>*{flex:1;width:0}
.fld .rr{display:flex;gap:6px;align-items:center;min-width:0}.fld .rr input[type=range]{flex:1;min-width:0;width:0}.fld .rr input[type=number]{width:58px;flex:none}.fld>*{min-width:0}
.pal{display:grid;grid-template-columns:1fr 1fr;gap:4px}
.pal button{display:flex;align-items:center;gap:7px;text-align:left;padding:5px 7px;font-size:12.5px;overflow:hidden}
.pal button i{width:16px;height:16px;border-radius:3px;border:1px solid #0009;flex:none}.pal button em{font-style:normal;font-size:16px;line-height:1;width:18px;text-align:center}
.pal button small{margin-left:auto;color:var(--dim2);font-size:10.5px}
.pal.one{grid-template-columns:1fr}
.search{width:100%;margin-bottom:8px}
.list{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:8px;padding:4px 6px;border-radius:4px;cursor:pointer;min-height:26px}
.row:hover{background:#ffffff0c}.row.on{background:#4a3416}.row .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.row .xy{color:var(--dim2);font-size:11.5px;font-variant-numeric:tabular-nums}
.row .ic{width:18px;text-align:center}
.chips{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:8px}.chips button{padding:2px 8px;font-size:12px;border-radius:12px}
.lay .row{cursor:default}.lay .row button{padding:1px 6px;background:none;border-color:transparent;color:var(--dim)}.lay .row button.on{color:var(--gold);background:none;border-color:transparent}
.prob .row{align-items:flex-start}.prob .sev{width:16px;text-align:center}.prob .err{color:var(--red)}.prob .warn{color:var(--amber)}.prob .info{color:var(--blue)}
.hist .row.fut{opacity:.45}
.card{border:1px solid var(--line2);border-radius:6px;padding:10px;background:#120d09;margin-bottom:8px}
.card .title{font-weight:650;margin-bottom:6px;display:flex;align-items:center;gap:8px}
.btns{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.swatches{display:flex;gap:4px;flex-wrap:wrap;margin-top:4px}.swatches span{width:18px;height:18px;border-radius:3px;border:1px solid #0009;cursor:pointer}
.warnline{color:var(--amber);font-size:12px;margin:4px 0}
#status{grid-column:1/-1;display:flex;align-items:center;gap:16px;padding:0 10px;background:var(--p2);border-top:1px solid var(--line);font-size:12px;color:var(--dim);white-space:nowrap;overflow:hidden}
#status b{color:var(--txt);font-weight:600}#status .sp{flex:1;overflow:hidden;text-overflow:ellipsis}#status .clk{cursor:pointer}#status .clk:hover{color:var(--txt)}
#stSave.dirty{color:var(--amber)}
/* overlays */
.ovl{position:fixed;inset:0;background:#0008;display:flex;align-items:flex-start;justify-content:center;z-index:100;padding-top:9vh}
.dlg{background:var(--p2);border:1px solid var(--line2);border-radius:10px;box-shadow:0 20px 60px #000c;width:min(560px,94vw);max-height:82vh;display:flex;flex-direction:column}
.dlg header{padding:12px 16px;border-bottom:1px solid var(--line);font:650 15px Georgia,serif;color:var(--gold2);display:flex;align-items:center}
.dlg header button{margin-left:auto}
.dlg .db{padding:14px 16px;overflow:auto;user-select:text}.dlg footer{padding:10px 16px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end}
.dlg p{margin:0 0 10px}.dlg ol,.dlg ul{margin:0 0 10px;padding-left:20px}.dlg li{margin:3px 0}
.qo{width:min(620px,94vw)}.qo input{width:100%;font-size:15px;padding:10px 12px;border:0;border-bottom:1px solid var(--line);border-radius:10px 10px 0 0;background:#0f0b08}
.qo .res{max-height:52vh;overflow:auto;padding:6px}.qo .row .k{color:var(--dim);font-size:11.5px}.qo .row.on{background:#4a3416}
.sc{display:grid;grid-template-columns:1fr 1fr;gap:4px 24px}.sc div{display:flex;justify-content:space-between;gap:10px;padding:2px 0;border-bottom:1px solid #ffffff08}
#ctx{position:fixed;z-index:120;background:var(--p2);border:1px solid var(--line2);border-radius:6px;padding:4px;box-shadow:0 10px 30px #000a;min-width:220px}
#toasts{position:fixed;left:50%;bottom:40px;transform:translateX(-50%);display:flex;flex-direction:column;gap:6px;align-items:center;z-index:99;pointer-events:none}
.toast{background:#241a10f2;border:1px solid var(--line2);border-left:3px solid var(--gold);border-radius:6px;padding:7px 14px;box-shadow:0 6px 20px #0009;animation:tin .18s ease-out}
.toast.err{border-left-color:var(--red)}
@keyframes tin{from{opacity:0;transform:translateY(8px)}}
#loading{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:200;text-align:center;padding:20px}
#loading h2{font-family:Georgia,serif;color:var(--gold);font-weight:600}#loading .bar{width:260px;height:4px;background:var(--p3);border-radius:2px;margin:16px auto;overflow:hidden}
#loading .bar i{display:block;height:100%;width:40%;background:var(--gold);animation:ld 1.2s infinite ease-in-out}@keyframes ld{0%{margin-left:-40%}100%{margin-left:100%}}
.hidden{display:none!important}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:#3a2c1e;border-radius:5px;border:2px solid var(--p1)}::-webkit-scrollbar-track{background:transparent}
</style></head><body>
<div id="app">
 <div id="menubar">
  <div class="logo"><b>E</b>World Editor</div>
  <div id="menus" style="display:flex"></div>
  <span class="sp"></span>
  <span id="docname"></span>
  <div class="qb">
   <button class="ghost" id="qUndo" title="Undo (Ctrl+Z)"><svg class="ico" viewBox="0 0 24 24"><path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg></button>
   <button class="ghost" id="qRedo" title="Redo (Ctrl+Shift+Z)"><svg class="ico" viewBox="0 0 24 24"><path d="M15 14l5-5-5-5"/><path d="M20 9H10a6 6 0 0 0 0 12h3"/></svg></button>
   <button id="qPrev" title="Walk around your changes in the game (Ctrl+P)">▶ Preview</button>
   <button id="qPub" class="pri" title="Publish or export your world (Ctrl+E)">Publish…</button>
  </div>
 </div>
 <div id="optbar"></div>
 <div id="toolbar"></div>
 <div id="view"><canvas id="cv"></canvas><canvas id="mini"></canvas>
  <div id="zoombox"><button id="zOut" title="Zoom out (-)">−</button><span id="zPct">100%</span><button id="zIn" title="Zoom in (+)">+</button><button id="zFit" title="Whole map (Home)">⤢</button></div>
  <div id="hoverTip"></div></div>
 <div id="side"><div class="split" id="split"></div>
  <div class="pane" id="paneTop"><div class="tabs" id="tabsTop"></div><div class="body" id="bodyTop"></div></div>
  <div class="pane" id="paneBot"><div class="tabs" id="tabsBot"></div><div class="body" id="bodyBot"></div></div>
 </div>
 <div id="status"><span id="stPos">–</span><span class="sp" id="stHint"></span><span id="stSel"></span><span id="stEd" class="clk" title="Show everything you changed"></span><span id="stProb" class="clk" title="Show problems"></span><span id="stSave"></span></div>
</div>
<div id="toasts"></div>
<div id="loading"><div><h2>Loading the world of Emberfall…</h2><div class="bar"><i></i></div><p style="color:var(--dim)">The editor builds the map exactly the way the game does. This takes a few seconds.</p></div></div>
<input type="file" id="fOpen" accept=".js,.json" hidden>
<iframe id="game" title="world loader" style="position:absolute;left:-9999px;top:0;width:320px;height:200px;border:0"></iframe>
<script>
'use strict';
/* ===================== Emberfall World Editor 2 =====================

const LS={get(k,d){ try{ const v=localStorage.getItem(k); return v==null?d:JSON.parse(v); }catch(e){ return d; } }, set(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); return true; }catch(e){ return false; } }};
let W=null;                       // the base world, built by the game itself

const KINDS=['props','npcs','spawns','pois'];

const KI={props:'🌳',npcs:'🧑',spawns:'👹',pois:'⭐'};
const TCOL={GRASS:'#5f8f3a',FOREST:'#3f6b2a',TREE:'#22421a',SWAMP:'#4d5a34',WATER:'#2f6fa0',LAVA:'#e0561c',ASH:'#4a403c',ROCK:'#7a7470',PATH:'#b49a6a',BRIDGE:'#8a6a48',COBBLE:'#b8ad98',HOUSE:'#a8442e',TWALL:'#7d7468',WALL:'#6d665e',SAND:'#d8c48a',SNOW:'#e8eef2',ICE:'#a8d8f0',RUIN:'#8d8a78',FOUNT:'#4fa0d8',FENCE:'#8a6a3a',PROP:'#c08040',MEADOW:'#6f9a44',FROST:'#cfe0e8',VOID:'#111',DWALL:'#3a3440',COLUMN:'#8a8478',DGATE:'#6a5a40',DOOR:'#7a4a2a'};
const TDESC={GRASS:'Grass',FOREST:'Forest floor',SWAMP:'Swamp mud',SAND:'Sand',SNOW:'Snow',ICE:'Ice',ASH:'Ash',PATH:'Dirt road',COBBLE:'Cobblestone',BRIDGE:'Bridge',RUIN:'Ruin floor',TREE:'Tree',ROCK:'Rock',WALL:'Stone wall',TWALL:'Town wall',HOUSE:'House block',FENCE:'Fence',WATER:'Water',LAVA:'Lava'};

const PROPS={tree:['🌳','Tree'],pine:['🌲','Pine'],deadtree:['🪵','Dead tree'],bush:['🌿','Bush'],flowers:['🌼','Flowers'],mushrooms:['🍄','Glowing mushrooms'],rock:['🪨','Rock'],boulder:['⛰','Boulder'],crystal:['💎','Ice crystals'],house:['🏠','Cottage'],tent:['⛺','Tent'],well:['🪣','Well'],statue:['🗿','Statue'],pillar:['🏛','Pillar'],wall:['🧱','Stone wall'],tower:['🏰','Watchtower'],campfire:['🔥','Campfire'],lamp:['🏮','Street lamp'],torch:['🕯','Torch'],crate:['📦','Crate'],barrel:['🛢','Barrel'],fence:['🚧','Fence'],banner:['🚩','Banner'],stall:['🛒','Market stall'],cart:['🛞','Cart'],bench:['🪑','Bench'],sign:['🪧','Signpost'],grave:['🪦','Gravestone'],hay:['🌾','Hay bale']};
const SOLIDPROP=new Set(['tree','pine','deadtree','rock','boulder','house','tent','well','statue','pillar','wall','tower']);
const PROPGRP={Nature:['tree','pine','deadtree','bush','flowers','mushrooms','rock','boulder','crystal','hay'],Buildings:['house','tent','well','tower','wall','pillar','statue','fence'],Village:['campfire','lamp','torch','crate','barrel','banner','stall','cart','bench','sign','grave']};
const NPCCOL=['#8a7a5a','#a84a3a','#4a6aa8','#4a8a4a','#8a4a9a','#c89a3a','#3a8a8a','#cfcfcf','#3a3a3a','#b86a2a'];
const MAXPROPS=4000;
const VIEW={x:0,y:0,z:4};
const ST=Object.assign({tool:'select',layer:'tile',tile:'GRASS',zone:'meadow',prop:'tree',mob:'boar',n:3,brush:2,shape:'circle',filled:true,rot:0,scale:1,rndRot:false,rndScale:0,scatter:false,density:4,snap:false,fillLimit:6000,erT:true,erZ:true,erO:true,rightW:310,minimap:true,
  autoTab:true},LS.get('ef_editor_prefs',{}));
const LAY=Object.assign({base:{v:1},tiles:{v:1},tint:{v:0},borders:{v:1},grid:{v:1},labels:{v:1},props:{v:1,l:0},npcs:{v:1,l:0},spawns:{v:1,l:0},pois:{v:1,l:0}},LS.get('ef_editor_layers',{}));
const savePrefs=()=>{ LS.set('ef_editor_prefs',ST); LS.set('ef_editor_layers',LAY); };
let sel=new Set(), selRect=null, clip=LS.get('ef_editor_clip',null), pasteMode=false;
let base=null, over=null, tint=null, borders=null, bordersDirty=true;

/* ---------- toasts and dialogs ---------- */
function toast(msg,err){ const box=$('toasts'); while(box.children.length>=3) box.firstChild.remove(); const d=document.createElement('div'); d.className='toast'+(err?' err':''); d.textContent=msg; $('toasts').appendChild(d); setTimeout(()=>{ d.style.transition='opacity .3s'; d.style.opacity=0; setTimeout(()=>d.remove(),320); },err?4200:2400); }
let dlgOpen=0;
function dlg({title,html,buttons=[{t:'OK',v:true,pri:1}],wide,onOpen}){ return new Promise(res=>{ const o=document.createElement('div'); o.className='ovl';
  o.innerHTML=`<div class="dlg" style="${wide?'width:min(760px,95vw)':''}"><header>${esc(title)}<button class="ghost" data-x>✕</button></header><div class="db">${html}</div>${buttons.length?`<footer>${buttons.map((b,i)=>`<button data-i="${i}" class="${b.pri?'pri':''} ${b.cls||''}">${esc(b.t)}</button>`).join('')}</footer>`:''}</div>`;
  document.body.appendChild(o); dlgOpen++; const close=v=>{ o.remove(); dlgOpen--; removeEventListener('keydown',kd,true); res(v); };
  const kd=e=>{ if(e.key==='Escape'){ e.stopPropagation(); close(null); } else if(e.key==='Enter'&&!/TEXTAREA/.test(document.activeElement.tagName)){ const p=buttons.findIndex(b=>b.pri); if(p>=0){ e.preventDefault(); e.stopPropagation(); close(buttons[p].v===undefined?true:(buttons[p].get?buttons[p].get(o):buttons[p].v)); } } };
  addEventListener('keydown',kd,true);
  o.addEventListener('mousedown',e=>{ if(e.target===o) close(null); }); o.querySelector('[data-x]').onclick=()=>close(null);
  o.querySelectorAll('footer button').forEach(b=>b.onclick=()=>{ const B=buttons[+b.dataset.i]; close(B.get?B.get(o):B.v); });
  if(onOpen) onOpen(o,close); const f=o.querySelector('input,textarea'); if(f){ f.focus(); if(f.select) f.select(); } }); }
const confirmDlg=(title,text,ok='OK',danger)=>dlg({title,html:`<p>${text}</p>`,buttons:[{t:'Cancel',v:false},{t:ok,v:true,pri:1,cls:danger?'danger':''}]});
const askDlg=(title,label,def='')=>dlg({title,html:`<p>${label}</p><input type="text" id="dlgIn" style="width:100%" maxlength="60" value="${esc(def)}">`,buttons:[{t:'Cancel',v:null},{t:'OK',pri:1,get:o=>o.querySelector('#dlgIn').value.trim()||null}]});

/* ---------- loading the world through the game ---------- */
function start(){ const fr=$('game'), here=location.pathname.replace(/[^/]*$/,'');
  if(location.protocol==='file:'){ $('loading').innerHTML='<div><h2>Open the editor from your realm</h2><p>The editor needs the game next to it. Open <b>/play/editor.html</b> on your Emberfall site, for example<br><b>https://emberfall-sb6p.onrender.com/play/editor.html</b></p></div>'; return; }
  fr.src=here+'index.html?editor=1&t='+Date.now();
  const poll=setInterval(()=>{ try{ const w=fr.contentWindow.__EF; if(w){ clearInterval(poll); W=w; ready(); } }catch(e){} },250);
  setTimeout(()=>{ if(!W) $('loading').innerHTML='<div><h2>The world did not load</h2><p>Make sure this page is opened from your realm at <b>/play/editor.html</b>, then reload the page.</p><button onclick="location.reload()">Reload</button></div>'; },90000); }
function ready(){ const T=W.T; W.tname={}; for(const k in T) W.tname[T[k]]=k; W.mobByKey={}; for(const m of W.mobTypes) W.mobByKey[m.key]=m;
  W.baseNpcTiles=new Map(); for(const n of W.npcs) W.baseNpcTiles.set(n.x+','+n.y,n);
  buildBase(); over=mk(W.MW,W.OWH); tint=mk(W.MW,W.OWH); rebuildTint();
  VIEW.x=W.town.x+.5; VIEW.y=W.town.y+.5; VIEW.z=6;
  const d=LS.get('ef_editor_draft',null); if(d) loadData(d,'replace',true);
  undo=[]; redo=[];
  setTimeout(()=>{ try{ $('game').remove(); }catch(e){} },500);   // the hidden game is no longer needed; this frees its memory
  $('loading').remove(); buildMenus(); buildToolbar(); setTool(ST.tool==='paste'?'select':ST.tool,true); renderTabs(); layout(); draw(); updateStatus(); runChecks();
  if(!LS.get('ef_editor_seen2',0)){ LS.set('ef_editor_seen2',1); showWelcome(); } }
const mk=(w,h)=>{ const c=document.createElement('canvas'); c.width=w; c.height=h; return c; };
const hex=h=>{ h=h||'#333'; return [parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)]; };
function noise(x,y){ let n=x*374761393+y*668265263; n=(n^(n>>13))*1274126177; return ((n^(n>>16))&255)/255; }
function buildBase(){ base=mk(W.MW,W.OWH); const bx=base.getContext('2d'), id=bx.createImageData(W.MW,W.OWH);
  for(let y=0;y<W.OWH;y++) for(let x=0;x<W.MW;x++){ const i=y*W.MW+x, c=hex(TCOL[W.tname[W.map[i]]]), f=.92+noise(x,y)*.14; id.data.set([c[0]*f,c[1]*f,c[2]*f,255],i*4); }
  bx.putImageData(id,0,0); }
function rebuildTint(){ const tx=tint.getContext('2d'), id=tx.createImageData(W.MW,W.OWH);
  for(let y=0;y<W.OWH;y++) for(let x=0;x<W.MW;x++){ const z=zoneAt(x,y); if(!z) continue; const c=hex(ZCOL[z]||'#888888'); id.data.set([c[0],c[1],c[2],255],(y*W.MW+x)*4); }
  tx.putImageData(id,0,0); bordersDirty=true; }
function rebuildBorders(){ const S=4; borders=borders||mk(W.MW*S,W.OWH*S); const bx=borders.getContext('2d'); bx.clearRect(0,0,borders.width,borders.height); bx.fillStyle='#fff';
  for(let y=0;y<W.OWH;y++) for(let x=0;x<W.MW;x++){ const z=zoneAt(x,y); if(x+1<W.MW&&zoneAt(x+1,y)!==z) bx.fillRect((x+1)*S-1,y*S,2,S); if(y+1<W.OWH&&zoneAt(x,y+1)!==z) bx.fillRect(x*S,(y+1)*S-1,S,2); }
  bordersDirty=false; }

/* ---------- the map ---------- */
const inMap=(x,y)=>x>=1&&y>=1&&x<W.MW-1&&y<W.OWH-1;
const baseTile=(x,y)=>W.tname[W.map[y*W.MW+x]];
const tileAt=(x,y)=>(x<0||y<0||x>=W.MW||y>=W.OWH)?null:(ED.tiles[x+','+y]||baseTile(x,y));
const zoneAt=(x,y)=>(x<0||y<0||x>=W.MW||y>=W.OWH)?null:(ED.zones[x+','+y]||W.zmap[y*W.MW+x]);
const zoneName=z=>(W.zones[z]||z||'');
function setTile(x,y,t){ if(!inMap(x,y)) return false; const k=x+','+y, cur=ED.tiles[k];
  if(baseTile(x,y)===t){ if(cur===undefined) return false; delete ED.tiles[k]; } else { if(cur===t) return false; ED.tiles[k]=t; }
  const ox=over.getContext('2d'); ox.clearRect(x,y,1,1); if(ED.tiles[k]){ const c=hex(TCOL[t]), f=.92+noise(x,y)*.14; ox.fillStyle=`rgb(${c[0]*f|0},${c[1]*f|0},${c[2]*f|0})`; ox.fillRect(x,y,1,1); } return true; }
function setZone(x,y,z){ if(x<0||y<0||x>=W.MW||y>=W.OWH) return false; const k=x+','+y, cur=ED.zones[k];
  if(W.zmap[y*W.MW+x]===z){ if(cur===undefined) return false; delete ED.zones[k]; } else { if(cur===z) return false; ED.zones[k]=z; }
  const tx=tint.getContext('2d'); tx.clearRect(x,y,1,1); const zz=zoneAt(x,y); if(zz){ tx.fillStyle=ZCOL[zz]||'#888'; tx.fillRect(x,y,1,1); } bordersDirty=true; return true; }
function redrawOver(){ const ox=over.getContext('2d'); ox.clearRect(0,0,over.width,over.height); for(const k in ED.tiles){ const [x,y]=k.split(',').map(Number), c=hex(TCOL[ED.tiles[k]]), f=.92+noise(x,y)*.14; ox.fillStyle=`rgb(${c[0]*f|0},${c[1]*f|0},${c[2]*f|0})`; ox.fillRect(x,y,1,1); } }
const solidAt=(x,y)=>{ const t=tileAt(Math.floor(x),Math.floor(y)); return t==null||SOLID.has(t); };

/* ---------- the document ---------- */
const kindOf=o=>{ for(const k of KINDS) if(ED[k].includes(o)) return k; return null; };
const objName=(o,k)=>{ k=k||kindOf(o); return k==='props'?(PROPS[o.k]||['?',o.k])[1]:k==='npcs'?(o.name||'Villager'):k==='spawns'?`${mobName(o.mob)} ×${o.n}`:(o.name||'Unnamed landmark'); };
const objPos=(o,k)=>{ k=k||kindOf(o); return k==='props'?[o.x,o.y]:[o.x+.5,o.y+.5]; };
const mobName=k=>(W&&W.mobByKey[k]||{name:k}).name;
function exportData(){ const pair=o=>Object.entries(o).map(([k,v])=>{ const [x,y]=k.split(',').map(Number); return [x,y,v]; });
  return {v:1,tiles:pair(ED.tiles),zones:pair(ED.zones),
    props:ED.props.map(p=>({k:p.k,x:+(+p.x).toFixed(2),y:+(+p.y).toFixed(2),r:+(+p.r||0).toFixed(2),s:+(+p.s||1).toFixed(2)})),
    npcs:ED.npcs.map(n=>({name:n.name,title:n.title||'',x:n.x|0,y:n.y|0,col:n.col||'#8a7a5a',say:n.say||''})),
    spawns:ED.spawns.map(s=>({mob:s.mob,x:s.x|0,y:s.y|0,n:s.n|0||1})),pois:ED.pois.map(p=>({name:p.name,x:p.x|0,y:p.y|0,r:p.r|0||5}))}; }
function loadData(d,mode='replace',quiet){ d=d||{}; if(mode==='replace'){ ED.tiles={}; ED.zones={}; for(const k of KINDS) ED[k]=[]; }
  for(const e of d.tiles||[]) if(Array.isArray(e)&&W.T[e[2]]!=null&&inMap(e[0]|0,e[1]|0)&&baseTile(e[0]|0,e[1]|0)!==e[2]) ED.tiles[(e[0]|0)+','+(e[1]|0)]=e[2];
  for(const e of d.zones||[]) if(Array.isArray(e)&&(W.zones[e[2]]||e[2]==='town')&&W.zmap[(e[1]|0)*W.MW+(e[0]|0)]!==e[2]) ED.zones[(e[0]|0)+','+(e[1]|0)]=e[2];
  for(const p of d.props||[]) if(p&&PROPS[p.k]) ED.props.push({k:p.k,x:+p.x||0,y:+p.y||0,r:+p.r||0,s:+p.s||1});
  for(const n of d.npcs||[]) if(n) ED.npcs.push({name:String(n.name||'Villager').slice(0,28),title:String(n.title||'').slice(0,28),x:n.x|0,y:n.y|0,col:n.col||'#8a7a5a',say:String(n.say||'').slice(0,240)});
  for(const s of d.spawns||[]) if(s&&s.mob) ED.spawns.push({mob:s.mob,x:s.x|0,y:s.y|0,n:clamp(s.n|0||1,1,12)});
  for(const p of d.pois||[]) if(p) ED.pois.push({name:String(p.name||'').slice(0,30),x:p.x|0,y:p.y|0,r:clamp(p.r|0||5,2,20)});
  sel.clear(); selRect=null; if(over){ redrawOver(); rebuildTint(); } if(!quiet) changed(); }
const editCount=()=>Object.keys(ED.tiles).length+Object.keys(ED.zones).length+ED.props.length+ED.npcs.length+ED.spawns.length+ED.pois.length;

/* ---------- undo, redo and history ---------- */
let undo=[], redo=[], pending=null;
const snap=()=>JSON.stringify(ED);
function restore(s){ const d=JSON.parse(s); ED.tiles=d.tiles; ED.zones=d.zones; for(const k of KINDS) ED[k]=d[k]; sel.clear(); selRect=null; redrawOver(); rebuildTint(); }
/* begin(label) before a change, end() after it: a step that changed nothing leaves no history behind */
function begin(label){ if(pending) end(); pending={label,s:snap()}; }
function end(){ if(!pending) return false; const p=pending; pending=null; if(snap()===p.s) return false; undo.push({label:p.label,s:p.s,t:Date.now()}); if(undo.length>100) undo.shift(); redo=[]; changed(); return true; }
function doUndo(){ if(pending) end(); if(!undo.length) return toast('Nothing to undo'); const u=undo.pop(); redo.push({label:u.label,s:snap(),t:u.t}); restore(u.s); changed(); toast('Undid: '+u.label); }
function doRedo(){ if(!redo.length) return toast('Nothing to redo'); const r=redo.pop(); undo.push({label:r.label,s:snap(),t:r.t}); restore(r.s); changed(); toast('Redid: '+r.label); }
function jumpHistory(i){ // i = number of steps to keep
  while(undo.length>i){ const u=undo.pop(); redo.push({label:u.label,s:snap(),t:u.t}); restore(u.s); }
  while(undo.length<i&&redo.length){ const r=redo.pop(); undo.push({label:r.label,s:snap(),t:r.t}); restore(r.s); } changed(); }

/* ---------- saving ---------- */
let saveT=0, savedAt=0, checkT=0;
function changed(){ draw(); clearTimeout(saveT); $('stSave').textContent='● Saving…'; $('stSave').className='dirty'; saveT=setTimeout(saveDraft,350); clearTimeout(checkT); checkT=setTimeout(runChecks,500); refreshPanels(); updateStatus(); }
function saveDraft(){ const ok=LS.set('ef_editor_draft',exportData()); savedAt=Date.now(); $('stSave').textContent=ok?'✓ Saved in this browser '+new Date(savedAt).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}):'⚠ Not saved: browser storage is full. Export a backup.'; $('stSave').className=ok?'':'dirty'; }

/* ===================== view and drawing ===================== */
let DPR=1, CW=0, CH=0, hover=null, hoverObj=null, drag=null;
function layout(){ document.documentElement.style.setProperty('--rw',ST.rightW+'px'); DPR=devicePixelRatio||1; const r=cv.getBoundingClientRect(); CW=r.width; CH=r.height; cv.width=Math.round(CW*DPR); cv.height=Math.round(CH*DPR);
  if(W){ const mw=Math.min(240,Math.max(140,CW*.2)), mh=mw*W.OWH/W.MW; mini.style.width=mw+'px'; mini.style.height=mh+'px'; mini.width=Math.round(mw*DPR); mini.height=Math.round(mh*DPR); mini.classList.toggle('hidden',!ST.minimap); } draw(); }
const toScr=(x,y)=>[(x-VIEW.x)*VIEW.z+CW/2,(y-VIEW.y)*VIEW.z+CH/2];
const toW=(sx,sy)=>[(sx-CW/2)/VIEW.z+VIEW.x,(sy-CH/2)/VIEW.z+VIEW.y];
const visRect=()=>{ const [a,b]=toW(0,0),[c,d]=toW(CW,CH); return [Math.max(0,Math.floor(a)),Math.max(0,Math.floor(b)),Math.min(W.MW-1,Math.ceil(c)),Math.min(W.OWH-1,Math.ceil(d))]; };
function zoomAt(f,sx=CW/2,sy=CH/2){ const [x,y]=toW(sx,sy); VIEW.z=clamp(VIEW.z*f,.6,64); const [x2,y2]=toW(sx,sy); VIEW.x+=x-x2; VIEW.y+=y-y2; draw(); }
function centerOn(x,y,z){ VIEW.x=x; VIEW.y=y; if(z) VIEW.z=clamp(z,.6,64); draw(); }
function fitMap(){ VIEW.x=W.MW/2; VIEW.y=W.OWH/2; VIEW.z=Math.min(CW/W.MW,CH/W.OWH)*.95; draw(); }
function frameSel(){ if(!sel.size) return toast('Nothing is selected'); let a=1e9,b=1e9,c=-1e9,d=-1e9; for(const o of sel){ const [x,y]=objPos(o); a=Math.min(a,x); b=Math.min(b,y); c=Math.max(c,x); d=Math.max(d,y); }
  centerOn((a+c)/2,(b+d)/2,Math.min(28,Math.min(CW/(c-a+12),CH/(d-b+12)))); }
let drawQ=false; function draw(){ if(drawQ||!W) return; drawQ=true; requestAnimationFrame(()=>{ drawQ=false; try{ draw0(); drawMini(); }catch(e){ console.error(e); } }); }
function draw0(){ const Z=VIEW.z; g.setTransform(DPR,0,0,DPR,0,0); g.fillStyle='#080604'; g.fillRect(0,0,CW,CH);
  g.imageSmoothingEnabled=false; const [ox,oy]=toScr(0,0), mw=W.MW*Z, mh=W.OWH*Z;
  g.drawImage(base,ox,oy,mw,mh); if(LAY.tiles.v) g.drawImage(over,ox,oy,mw,mh);
  if(LAY.tint.v){ g.globalAlpha=.32; g.drawImage(tint,ox,oy,mw,mh); g.globalAlpha=1; }
  if(LAY.borders.v&&Z>=1.5){ if(bordersDirty) rebuildBorders(); g.globalAlpha=.55; g.imageSmoothingEnabled=Z<4; g.drawImage(borders,ox,oy,mw,mh); g.imageSmoothingEnabled=false; g.globalAlpha=1; }
  g.strokeStyle='#ffd36a55'; g.lineWidth=1; g.strokeRect(ox-.5,oy-.5,mw+1,mh+1);
  const [vx0,vy0,vx1,vy1]=visRect(), onScr=(x,y,m=40)=>{ const [sx,sy]=toScr(x,y); return sx>-m&&sy>-m&&sx<CW+m&&sy<CH+m; };
  // painted tiles get a faint outline when zoomed in so you can see what you changed
  if(LAY.tiles.v&&Z>=9){ g.strokeStyle='#ffd36a70'; for(const k in ED.tiles){ const i=k.indexOf(','), x=+k.slice(0,i), y=+k.slice(i+1); if(x<vx0||x>vx1||y<vy0||y>vy1) continue; const [sx,sy]=toScr(x,y); g.strokeRect(sx+.5,sy+.5,Z-1,Z-1); } }
  if(LAY.grid.v&&Z>=12){ g.strokeStyle='#00000038'; g.lineWidth=1; g.beginPath(); for(let x=vx0;x<=vx1+1;x++){ const [sx]=toScr(x,0); g.moveTo(Math.round(sx)+.5,0); g.lineTo(Math.round(sx)+.5,CH); } for(let y=vy0;y<=vy1+1;y++){ const [,sy]=toScr(0,y); g.moveTo(0,Math.round(sy)+.5); g.lineTo(CW,Math.round(sy)+.5); } g.stroke();
    if(Z>=24){ g.strokeStyle='#0000005a'; g.beginPath(); for(let x=Math.ceil(vx0/8)*8;x<=vx1;x+=8){ const [sx]=toScr(x,0); g.moveTo(Math.round(sx)+.5,0); g.lineTo(Math.round(sx)+.5,CH); } for(let y=Math.ceil(vy0/8)*8;y<=vy1;y+=8){ const [,sy]=toScr(0,y); g.moveTo(0,Math.round(sy)+.5); g.lineTo(CW,Math.round(sy)+.5); } g.stroke(); } }
  const lab=LAY.labels.v&&Z>=3.5;

  const ring=(sx,sy,r,col='#ffd36a',lw=2)=>{ g.beginPath(); g.arc(sx,sy,r,0,7); g.strokeStyle=col; g.lineWidth=lw; g.stroke(); };
  // the world as the game made it
  if(LAY.base.v){ const r=clamp(Z*.35,1.2,4);
    for(const m of W.mobs){ if(!onScr(m[1]+.5,m[2]+.5)) continue; dot(m[1]+.5,m[2]+.5,r,'#e8483acc'); }
    for(const p of W.pois){ if(!onScr(p.x+.5,p.y+.5,200)) continue; const [sx,sy]=toScr(p.x+.5,p.y+.5); if(Z>=2){ g.setLineDash([3,4]); ring(sx,sy,(p.r||5)*Z,'#ffd36a55',1); g.setLineDash([]); } dot(p.x+.5,p.y+.5,3.5,'#ffd36a','#000'); if(lab) label(p.name,sx,sy-8,'#ffe8a0'); }
    for(const n of W.npcs){ if(!onScr(n.x+.5,n.y+.5)) continue; const [sx,sy]=dot(n.x+.5,n.y+.5,3.6,'#ffe066','#000'); if(lab&&Z>=6) label(n.name,sx,sy-8,'#fff4c8',10.5); } }
  // your edits
  if(LAY.pois.v) for(const p of ED.pois){ if(!onScr(p.x+.5,p.y+.5,(p.r||5)*Z+40)) continue; const [sx,sy]=toScr(p.x+.5,p.y+.5); g.setLineDash([5,4]); ring(sx,sy,(p.r||5)*Z,sel.has(p)?'#ffd36a':'#ffd36a99',1.5); g.setLineDash([]);
    g.font='16px sans-serif'; g.textAlign='center'; g.textBaseline='middle'; g.fillText('⭐',sx,sy); g.textBaseline='alphabetic'; if(lab||sel.has(p)) label(p.name||'(no name)',sx,sy-13,'#ffe8a0',12); if(sel.has(p)) ring(sx,sy,12); else if(hoverObj===p) ring(sx,sy,12,'#fff8',1.5); }

      const s=clamp(Z*1.3*(p.s||1),9,64); g.font=`${s}px sans-serif`; g.textAlign='center'; g.textBaseline='middle'; g.fillText((PROPS[p.k]||['?'])[0],sx,sy); g.textBaseline='alphabetic';
      if(Z>=10){ g.strokeStyle='#ffffffa0'; g.lineWidth=1.5; g.beginPath(); g.moveTo(sx,sy); g.lineTo(sx+Math.cos(p.r||0)*s*.75,sy+Math.sin(p.r||0)*s*.75); g.stroke(); }

    dot(s.x+.5,s.y+.5,6,'#b8261c','#ffd0c8',1.5); g.font='700 9px sans-serif'; g.textAlign='center'; g.textBaseline='middle'; g.fillStyle='#fff'; g.fillText(s.n,sx,sy+.5); g.textBaseline='alphabetic';
    if(lab||sel.has(s)) label(mobName(s.mob),sx,sy-10,'#ffc0b4'); if(sel.has(s)) ring(sx,sy,10); else if(hoverObj===s) ring(sx,sy,10,'#fff8',1.5); }

    if(lab||sel.has(n)) label((n.name||'Villager')+(n.title?` ‹${n.title}›`:''),sx,sy-10,'#ffe8a0'); if(sel.has(n)) ring(sx,sy,10); else if(hoverObj===n) ring(sx,sy,10,'#fff8',1.5); }

    label(`${selRect.x1-selRect.x0+1} × ${selRect.y1-selRect.y0+1}`,(a+c)/2,b-6,'#ffd36a'); }

function startPaste(){ if(!clip) return toast('The clipboard is empty. Copy something first (Ctrl+C).'); if(ST.tool!=='select') setTool('select'); pasteMode=true; $('stHint').textContent='Click where the copy should go. Shift-click to keep pasting, Esc to stop.'; cv.style.cursor='copy'; draw(); }
function pasteAt(x,y){ begin('Paste'); const out=[]; for(const [dx,dy,t] of clip.tiles||[]) if(W.T[t]!=null) setTile(x+dx,y+dy,t);

/* ---------- picking objects on the map ---------- */
function pick(x,y,all){ const R=Math.max(.7,11/VIEW.z); let best=null,bd=R; const hits=[];

function baseAt(x,y){ const R=Math.max(.8,9/VIEW.z); for(const n of W.npcs) if(Math.hypot(n.x+.5-x,n.y+.5-y)<R) return {t:'NPC',n:n.name+(n.title?' ‹'+n.title+'›':'')}; for(const p of W.pois) if(Math.hypot(p.x+.5-x,p.y+.5-y)<R) return {t:'Landmark',n:p.name}; for(const m of W.mobs) if(Math.hypot(m[1]+.5-x,m[2]+.5-y)<R*.8) return {t:'Monster',n:mobName(m[0])}; return null; }

  if(t==='npc'){ begin('Add NPC'); const n={name:uniqueName('New villager'),title:'',x:tx,y:ty,col:NPCCOL[ED.npcs.length%NPCCOL.length],say:''}; ED.npcs.push(n); end(); setTool('select'); setSel([n]); focusField('iName'); return; }

function scatter(x,y){ const R=Math.max(1,ST.brush), n=Math.max(1,Math.round(ST.density*R*R*.12)); for(let i=0;i<n;i++){ const a=Math.random()*6.283, r=Math.sqrt(Math.random())*R, px=x+Math.cos(a)*r, py=y+Math.sin(a)*r;

addEventListener('pointermove',e=>{ if(!W) return; const r=cv.getBoundingClientRect(), mx=e.clientX-r.left, my=e.clientY-r.top, inside=mx>=0&&my>=0&&mx<CW&&my<CH;

  else tip.style.display='none';

addEventListener('pointerup',e=>{ if(!drag) return; const d=drag; drag=null; const [x,y]=hover||[0,0], tx=Math.floor(x), ty=Math.floor(y);

/* ---------- palette ---------- */
function palette(){ const t=ST.tool, q=palQ.toLowerCase(), m=s=>!q||String(s).toLowerCase().includes(q), srch=ph=>`<input type="search" class="search" id="palQ" placeholder="${ph}" value="${esc(palQ)}">`;
  if(['brush','line','rect','fill','pick'].includes(t)){

    const grp={Walkable:['GRASS','FOREST','SWAMP','SAND','SNOW','ICE','ASH','PATH','COBBLE','BRIDGE','RUIN'],Blocking:['TREE','ROCK','WALL','TWALL','HOUSE','FENCE'],Liquid:['WATER','LAVA']};

  else if(k==='npcs'){ const bad=solidAt(o.x+.5,o.y+.5);

      +(bad?'<div class="warnline">⚠ This spot is blocked. The game moves the NPC to the nearest open tile.</div>':''); }
  else if(k==='spawns'){ const mt=W.mobByKey[o.mob], bad=solidAt(o.x+.5,o.y+.5);
    h+=fld('Monster',`<select id="iMob">${W.mobTypes.slice().sort((a,b)=>a.lv[0]-b.lv[0]).map(x=>`<option value="${x.key}" ${o.mob===x.key?'selected':''}>${esc(x.name)} (Lv ${x.lv[0]}–${x.lv[1]})</option>`).join('')}</select>`)

      +(mt?`<div class="hint">Level ${mt.lv[0]}–${mt.lv[1]}${mt.zone?', usually found in '+esc(zoneName(mt.zone)):''}. Zone here: ${esc(zoneName(zoneAt(o.x,o.y)))}.</div>`:'<div class="warnline">⚠ Unknown monster: the game will skip this group.</div>')
      +(bad?'<div class="warnline">⚠ The centre is blocked. Monsters that land on blocked ground are skipped.</div>':''); }
  else if(k==='pois'){ h+=fld('Name',`<input type="text" id="iName" maxlength="30" value="${esc(o.name)}">`)+fld('Radius',`<div class="rr"><input type="range" id="iRadr" min="2" max="20" value="${o.r||5}">${num('iRad',o.r||5,1,2,20)}</div>`)+fld('Position',`<div class="two">${num('iX',o.x)}${num('iY',o.y)}</div>`)
      +(o.name?'':'<div class="warnline">⚠ A landmark without a name is skipped by the game.</div>'); }
  return h+`</div><div class="btns"><button id="iDup">Duplicate</button><button id="iCopy">Copy</button><button id="iZoom">Zoom to</button><button id="iDel" class="danger">Delete</button></div>`; }
function bindInspector(){ if(!sel.size) return; const L=[...sel], o=L[0];
  // live editing: one history step per field you touch
  const live=(id,label,apply,opts={})=>{ const e=$(id); if(!e) return; e.addEventListener('focus',()=>begin(label)); e.addEventListener('pointerdown',()=>{ if(!pending) begin(label); });
    e.addEventListener('input',()=>{ if(!pending) begin(label); apply(e.type==='number'||e.type==='range'?+e.value:e.value); if(opts.sync) opts.sync(); draw(); });
    e.addEventListener('change',()=>{ end(); if(opts.rerender) renderTop(); }); e.addEventListener('blur',()=>end()); };
  const pair=(a,b)=>({sync:()=>{ const A=$(a),B=$(b); if(document.activeElement===A) B.value=A.value; else A.value=B.value; }});
  const XY=(isP)=>{ live('iX','Move',v=>{ o.x=isP?clamp(v,1,W.MW-1):clamp(Math.round(v),1,W.MW-2); },{rerender:1}); live('iY','Move',v=>{ o.y=isP?clamp(v,1,W.OWH-1):clamp(Math.round(v),1,W.OWH-2); },{rerender:1}); };
  if(L.length===1){ const k=kindOf(o);
    if(k==='props'){ live('iK','Change prop',v=>o.k=v,{rerender:1}); XY(true); live('iRr','Rotate',v=>o.r=+(v*Math.PI/180).toFixed(3),pair('iRr','iR')); live('iR','Rotate',v=>o.r=+(((v%360)+360)%360*Math.PI/180).toFixed(3),pair('iR','iRr')); live('iSr','Resize',v=>o.s=clamp(v/100,.3,4),pair('iSr','iS')); live('iS','Resize',v=>o.s=clamp(v/100,.3,4),pair('iS','iSr')); }
    if(k==='npcs'){ live('iName','Rename NPC',v=>o.name=v.slice(0,28)); live('iTitle','Change title',v=>o.title=v.slice(0,28)); live('iCol','Change colour',v=>o.col=v); XY(false);
      live('iSay','Change what the NPC says',v=>{ o.say=v.slice(0,240); $('iSayN').textContent=o.say.length+'/240'; });
      $('bodyTop').querySelectorAll('[data-c]').forEach(s=>s.onclick=()=>{ begin('Change colour'); o.col=s.dataset.c; end(); renderTop(); }); }
    if(k==='spawns'){ live('iMob','Change monster',v=>o.mob=v,{rerender:1}); live('iNr','Change group size',v=>o.n=clamp(v|0,1,12),pair('iNr','iN')); live('iN','Change group size',v=>o.n=clamp(v|0,1,12),pair('iN','iNr')); XY(false); }
    if(k==='pois'){ live('iName','Rename landmark',v=>o.name=v.slice(0,30)); live('iRadr','Change radius',v=>o.r=clamp(v|0,2,20),pair('iRadr','iRad')); live('iRad','Change radius',v=>o.r=clamp(v|0,2,20),pair('iRad','iRadr')); XY(false); } }
  else { const P=L.filter(q=>ED.props.includes(q));
    if($('mS')){ let s0=null; $('mS').addEventListener('pointerdown',()=>{ begin('Resize'); s0=P.map(p=>p.s||1); }); $('mS').addEventListener('input',e=>{ if(!s0){ begin('Resize'); s0=P.map(p=>p.s||1); } const f=e.target.value/100; P.forEach((p,i)=>p.s=clamp(+(s0[i]*f).toFixed(2),.3,4)); $('mSv').textContent='×'+f.toFixed(2); draw(); }); $('mS').addEventListener('change',()=>{ end(); s0=null; }); }
    const act=(id,label,f)=>{ const e=$(id); if(e) e.onclick=()=>{ begin(label); P.forEach(f); end(); }; };
    act('mRR','Random rotation',p=>p.r=+(Math.random()*6.283).toFixed(2)); act('mRS','Vary sizes',p=>p.s=clamp(+((p.s||1)*(.8+Math.random()*.4)).toFixed(2),.3,4)); act('mR0','Face north',p=>p.r=0); }
  if($('iDup')) $('iDup').onclick=()=>duplicateSel(); if($('iCopy')) $('iCopy').onclick=()=>copySel(); if($('iZoom')) $('iZoom').onclick=frameSel; if($('iDel')) $('iDel').onclick=deleteSel; }

function outliner(){ const q=outQ.toLowerCase(), chips=[['all','All'],...KINDS.map(k=>[k,KNP[k]])];
  let rows=[]; for(const k of KINDS){ if(outKind!=='all'&&outKind!==k) continue; ED[k].forEach((o,i)=>{ const n=objName(o,k); if(q&&!n.toLowerCase().includes(q)&&!(k==='npcs'&&(o.title||'').toLowerCase().includes(q))) return; rows.push([o,k,n]); }); }
  const total=rows.length, MAX=300, bad=new Set(problems.filter(p=>p.obj).map(p=>p.obj));
  return `<input type="search" class="search" id="outQ" placeholder="Search your objects…" value="${esc(outQ)}"><div class="chips">${chips.map(([k,n])=>`<button data-k="${k}" class="${outKind===k?'on':''}">${n} ${k==='all'?KINDS.reduce((a,b)=>a+ED[b].length,0):ED[k].length}</button>`).join('')}</div>
    <div class="list">${rows.slice(0,MAX).map(([o,k,n],i)=>`<div class="row ${sel.has(o)?'on':''}" data-i="${i}"><span class="ic">${k==='props'?(PROPS[o.k]||['?'])[0]:KI[k]}</span><span class="nm">${esc(n)}${k==='npcs'&&o.title?` <span style="color:var(--dim)">‹${esc(o.title)}›</span>`:''}</span>${bad.has(o)?'<span style="color:var(--amber)" title="Has a problem">⚠</span>':''}<span class="xy">${Math.floor(o.x)}, ${Math.floor(o.y)}</span></div>`).join('')}
    ${total>MAX?`<p class="hint">…and ${total-MAX} more. Search to narrow the list.</p>`:''}${!total?`<p class="hint">${editCount()?'Nothing matches.':'You have not placed anything yet. Pick a tool on the left and click the map.'}</p>`:''}</div>`;
  /* rows are rebuilt in bindBot */ }
let outRows=[];
function bindBot(){ const b=$('bodyBot');
  if(botTab==='out'){ const q=outQ.toLowerCase(); outRows=[]; for(const k of KINDS){ if(outKind!=='all'&&outKind!==k) continue; for(const o of ED[k]){ const n=objName(o,k); if(q&&!n.toLowerCase().includes(q)&&!(k==='npcs'&&(o.title||'').toLowerCase().includes(q))) continue; outRows.push(o); } }
    const i=$('outQ'); i.oninput=()=>{ outQ=i.value; const p=i.selectionStart; renderBot(); const n=$('outQ'); n.focus(); n.setSelectionRange(p,p); };

    b.querySelectorAll('.row[data-i]').forEach(r=>{ const o=outRows[+r.dataset.i]; r.onclick=e=>{ if(ST.tool!=='select') setTool('select'); if(e.shiftKey||e.ctrlKey||e.metaKey){ sel.has(o)?sel.delete(o):sel.add(o); setSel([...sel]); } else { setSel([o]); const [x,y]=objPos(o); centerOn(x,y,Math.max(VIEW.z,10)); } }; r.ondblclick=()=>{ setSel([o]); frameSel(); showTop('insp'); focusField('iName'); }; }); }
  if(botTab==='lay'){ b.querySelectorAll('[data-v]').forEach(e=>e.onclick=()=>{ const L=LAY[e.dataset.v]; L.v=L.v?0:1; if(!L.v) for(const o of [...sel]) if(ED[e.dataset.v]&&ED[e.dataset.v].includes(o)) sel.delete(o); savePrefs(); renderBot(); draw(); });
    b.querySelectorAll('[data-l]').forEach(e=>e.onclick=()=>{ const L=LAY[e.dataset.l]; L.l=L.l?0:1; if(L.l) for(const o of [...sel]) if(ED[e.dataset.l].includes(o)) sel.delete(o); savePrefs(); renderBot(); draw(); });
    const m=$('layMini'); if(m) m.onchange=()=>{ ST.minimap=m.checked; savePrefs(); layout(); }; }
  if(botTab==='prob'){ b.querySelectorAll('.row[data-i]').forEach(r=>r.onclick=()=>{ const p=problems[+r.dataset.i]; if(p.obj){ if(ST.tool!=='select') setTool('select'); setSel([p.obj]); } centerOn(p.x,p.y,Math.max(VIEW.z,12)); }); const rc=$('reCheck'); if(rc) rc.onclick=()=>{ runChecks(); toast(problems.length?`${problems.length} thing${problems.length>1?'s':''} to look at`:'No problems found'); }; }
  if(botTab==='hist'){ b.querySelectorAll('.row[data-h]').forEach(r=>r.onclick=()=>jumpHistory(+r.dataset.h)); } }
function layersUI(){ const row=(k,ic,n,lockable)=>`<div class="row"><button data-v="${k}" class="${LAY[k].v?'on':''}" title="Show or hide">${LAY[k].v?'👁':'◌'}</button><span class="ic">${ic}</span><span class="nm">${n}</span>${lockable?`<button data-l="${k}" class="${LAY[k].l?'on':''}" title="Lock: can't be selected or erased">${LAY[k].l?'🔒':'🔓'}</button>`:''}</div>`;
  return `<h4>Your edits</h4><div class="lay">${row('tiles','🖌','Painted ground')}${row('props','🌳',`Props (${ED.props.length})`,1)}${row('npcs','🧑',`NPCs (${ED.npcs.length})`,1)}${row('spawns','👹',`Monsters (${ED.spawns.length})`,1)}${row('pois','⭐',`Landmarks (${ED.pois.length})`,1)}</div>

  const F=redo.slice().reverse().map((r,i)=>`<div class="row fut" data-h="${undo.length+i+1}"><span class="ic">↻</span><span class="nm">${esc(r.label)}</span></div>`);

/* ---------- problems: things the game would skip or that would play badly ---------- */
function runChecks(){ if(!W) return; const P=[], add=(sev,msg,x,y,obj)=>P.push({sev,msg,x,y,obj});
  const names=new Map(); for(const n of ED.npcs){ const id=String(n.name||'Villager').toLowerCase().replace(/[^a-z0-9]+/g,'').slice(0,20); if(names.has(id)) add('err',`Two NPCs are called "${n.name}". The game only loads the first one, so rename this one.`,n.x+.5,n.y+.5,n); else names.set(id,n);
    if(solidAt(n.x+.5,n.y+.5)) add('warn',`${n.name} stands on blocked ground. The game moves them to the nearest open tile.`,n.x+.5,n.y+.5,n); if(!n.say) add('info',`${n.name} has nothing to say yet.`,n.x+.5,n.y+.5,n); }
  for(const s of ED.spawns){ const mt=W.mobByKey[s.mob]; if(!mt) add('err',`Unknown monster "${s.mob}". The game skips this group.`,s.x+.5,s.y+.5,s);
    else if(solidAt(s.x+.5,s.y+.5)) add('warn',`${mt.name} ×${s.n} is placed on blocked ground. Monsters that land on blocked ground are skipped.`,s.x+.5,s.y+.5,s);
    if(zoneAt(s.x,s.y)==='town') add('warn',`${mobName(s.mob)} ×${s.n} is inside the town. They will attack players in town.`,s.x+.5,s.y+.5,s);
    if(mt&&mt.zone&&zoneAt(s.x,s.y)&&mt.zone!==zoneAt(s.x,s.y)&&zoneAt(s.x,s.y)!=='town') add('info',`${mt.name} usually lives in ${zoneName(mt.zone)}, but this group is in ${zoneName(zoneAt(s.x,s.y))}.`,s.x+.5,s.y+.5,s); }
  const pn=new Set(); for(const p of ED.pois){ if(!p.name) add('err','A landmark has no name. The game skips it.',p.x+.5,p.y+.5,p); else { const k=p.name.toLowerCase().replace(/[^a-z0-9]+/g,''); if(pn.has(k)||W.pois.some(b=>b.name.toLowerCase().replace(/[^a-z0-9]+/g,'')===k)) add('warn',`There is already a landmark called "${p.name}".`,p.x+.5,p.y+.5,p); pn.add(k); } }
  if(ED.props.length>MAXPROPS) add('err',`You have ${ED.props.length} props. The game only draws the first ${MAXPROPS}.`,ED.props[MAXPROPS].x,ED.props[MAXPROPS].y,ED.props[MAXPROPS]);
  let pw=0; for(const p of ED.props){ if(tileAt(Math.floor(p.x),Math.floor(p.y))==='WATER'&&SOLIDPROP.has(p.k)&&pw++<20) add('info',`A ${PROPS[p.k][1].toLowerCase()} stands in water. It is drawn, but does not block swimmers.`,p.x,p.y,p); }
  for(const n of W.npcs){ const t=ED.tiles[n.x+','+n.y]; if(t&&SOLID.has(t)) add('warn',`Your ${TDESC[t].toLowerCase()} covers ${n.name}. The game will move them to the nearest open tile.`,n.x+.5,n.y+.5,null); }
  const blockedTown=Object.entries(ED.tiles).filter(([k,t])=>SOLID.has(t)&&(()=>{ const [x,y]=k.split(',').map(Number); return Math.hypot(x-W.town.x,y-W.town.y)<4; })()).length; if(blockedTown) add('warn',`${blockedTown} blocking tile${blockedTown>1?'s are':' is'} right next to the town square, where new players arrive.`,W.town.x+.5,W.town.y+.5,null);
  const ord={err:0,warn:1,info:2}; problems=P.sort((a,b)=>ord[a.sev]-ord[b.sev]); renderTabs(); if(botTab==='prob') renderBot(); updateStatus(); }
function problemsUI(){ if(!problems.length) return `<p class="hint">✓ No problems found. Everything you placed will load in the game.</p><div class="btns"><button id="reCheck">Check again</button></div>`;
  return `<div class="list prob">${problems.map((p,i)=>`<div class="row" data-i="${i}"><span class="sev ${p.sev}">${p.sev==='err'?'⛔':p.sev==='warn'?'⚠':'ℹ'}</span><span class="nm" style="white-space:normal">${esc(p.msg)}</span></div>`).join('')}</div><div class="btns"><button id="reCheck">Check again</button></div>`; }

  const e=problems.filter(p=>p.sev==='err').length, w=problems.filter(p=>p.sev==='warn').length; $('stProb').innerHTML=e?`<span style="color:var(--red)">⛔ ${e}</span> `:''; $('stProb').innerHTML+=w?`<span style="color:var(--amber)">⚠ ${w}</span>`:(e?'':'<span style="color:var(--green)">✓ No problems</span>');

const checked=id=>({tGrid:LAY.grid.v,tTint:LAY.tint.v,tBorders:LAY.borders.v,tBase:LAY.base.v,tLabels:LAY.labels.v,tMini:ST.minimap,tSnap:ST.snap})[id];
function buildMenus(){ const m=$('menus'); m.innerHTML=MENUS.map(([n],i)=>`<div class="menu" data-m="${i}"><button>${n}</button><div class="drop"></div></div>`).join('');
  m.querySelectorAll('.menu').forEach(el=>{ const fill=()=>{ el.querySelector('.drop').innerHTML=MENUS[+el.dataset.m][1].map(id=>{ if(id==='|') return '<div class="msep"></div>'; const c=CMDS[id], ck=checked(id), dis=(id==='undo'&&!undo.length)||(id==='redo'&&!redo.length)||(['cut','copy','dup','del','frame'].includes(id)&&!sel.size)||(id==='paste'&&!clip);
      return `<div class="mi ${dis?'dis':''}" data-c="${id}"><span class="chk">${ck===undefined?(c.tool&&ST.tool===c.id.slice(5)?'●':''):ck?'✓':''}</span>${esc(c.name)}<span class="k">${keyLabel(c.key)}</span></div>`; }).join('');
      el.querySelectorAll('.mi').forEach(mi=>mi.onclick=()=>{ closeMenus(); CMDS[mi.dataset.c].run(); }); };
    el.querySelector('button').onclick=e=>{ e.stopPropagation(); const was=el.classList.contains('open'); closeMenus(); if(!was){ fill(); el.classList.add('open'); } };
    el.querySelector('button').onmouseenter=()=>{ if(document.querySelector('.menu.open')&&!el.classList.contains('open')){ closeMenus(); fill(); el.classList.add('open'); } }; }); }
function closeMenus(){ document.querySelectorAll('.menu.open').forEach(m=>m.classList.remove('open')); }
addEventListener('pointerdown',e=>{ if(!e.target.closest('.menu')) closeMenus(); if(!e.target.closest('#ctx')) hideCtx(); });
$('qUndo').onclick=doUndo; $('qRedo').onclick=doRedo; $('qPrev').onclick=preview; $('qPub').onclick=publishDlg;

/* keyboard */
addEventListener('keydown',e=>{ if(!W||dlgOpen) return; const typing=/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName), mod=e.ctrlKey||e.metaKey, k=e.key, kl=k.toLowerCase();
  if(mod&&kl==='s'){ e.preventDefault(); return CMDS.saveVer.run(); } if(mod&&kl==='e'){ e.preventDefault(); return publishDlg(); } if(mod&&kl==='p'){ e.preventDefault(); return preview(); }
  if(mod&&kl==='f'){ e.preventDefault(); return quickOpen(''); } if(mod&&kl==='k'){ e.preventDefault(); return quickOpen('>'); } if(mod&&kl==='g'){ e.preventDefault(); return CMDS.goto.run(); } if(mod&&kl==='o'){ e.preventDefault(); return CMDS.open.run(); }
  if(typing){ if(k==='Escape') document.activeElement.blur(); return; }
  if(mod&&kl==='z'){ e.preventDefault(); return e.shiftKey?doRedo():doUndo(); } if(mod&&kl==='y'){ e.preventDefault(); return doRedo(); }
  if(mod&&kl==='c'){ e.preventDefault(); return copySel(); } if(mod&&kl==='x'){ e.preventDefault(); return copySel(true); } if(mod&&kl==='v'){ e.preventDefault(); return startPaste(); }
  if(mod&&kl==='d'){ e.preventDefault(); return duplicateSel(); } if(mod&&kl==='a'){ e.preventDefault(); return selectAll(); } if(mod&&k==='\''){ e.preventDefault(); return togLay('grid'); }
  if(mod) return;
  if(k===' '){ e.preventDefault(); if(!spaceDown){ spaceDown=true; cv.style.cursor='grab'; } return; }
  if(k==='Escape'){ hideCtx(); if(pasteMode){ pasteMode=false; setTool('select'); return; } if(drag&&drag.k!=='pan'){ if(pending){ restore(pending.s); pending=null; } drag=null; draw(); return; } if(sel.size||selRect){ selRect=null; setSel([]); } else if(ST.tool!=='select') setTool('select'); return; }
  if(k==='Delete'||k==='Backspace'){ e.preventDefault(); return deleteSel(); }
  if(k.startsWith('Arrow')&&sel.size){ e.preventDefault(); const s=e.shiftKey?5:1; return nudge(k==='ArrowLeft'?-s:k==='ArrowRight'?s:0,k==='ArrowUp'?-s:k==='ArrowDown'?s:0); }
  if(k.startsWith('Arrow')){ e.preventDefault(); const s=(e.shiftKey?240:80)/VIEW.z; VIEW.x+=k==='ArrowLeft'?-s:k==='ArrowRight'?s:0; VIEW.y+=k==='ArrowUp'?-s:k==='ArrowDown'?s:0; return draw(); }
  if(k==='['||k===']'){ ST.brush=clamp(ST.brush+(k===']'?1:-1),1,15); savePrefs(); buildOptbar(); return draw(); }
  if(k==='+'||k==='='){ return zoomAt(1.4); } if(k==='-'||k==='_'){ return zoomAt(1/1.4); } if(k==='Home'){ return fitMap(); } if(k==='?'){ return shortcutsDlg(); }
  if(kl==='r'){ return rotateSel(e.shiftKey?-Math.PI/4:Math.PI/4); } if(kl==='f'&&!e.shiftKey){ return sel.size?frameSel():null; } if(kl==='t'){ return CMDS.town.run(); } if(kl==='z'){ return togLay('tint'); } if(k==='1'){ return CMDS.z100.run(); }
  if(kl==='x'&&['brush','line','rect','fill'].includes(ST.tool)){ ST.layer=ST.layer==='zone'?'tile':'zone'; savePrefs(); buildOptbar(); renderTop(); return draw(); }
  const t=TOOLS.find(t=>t!=='|'&&t.key.toLowerCase()===kl); if(t) setTool(t.id); });
addEventListener('keyup',e=>{ if(e.key===' '){ spaceDown=false; if(!drag) cv.style.cursor=ST.tool==='pan'?'grab':ST.tool==='select'?'default':'crosshair'; } });
addEventListener('blur',()=>{ spaceDown=false; });

/* ---------- right-click menu ---------- */
function openCtx(cx,cy,x,y){ const o=pick(x,y), tx=Math.floor(x), ty=Math.floor(y); if(o&&!sel.has(o)){ if(ST.tool!=='select') setTool('select'); setSel([o]); }
  const items=[]; const it=(n,f,k,dis)=>items.push({n,f,k,dis});
  if(sel.size){ it(sel.size>1?`${sel.size} objects`:objName([...sel][0]),null,null,true); it('Properties',()=>showTop('insp')); it('Duplicate',()=>duplicateSel(),MOD+'+D'); it('Copy',()=>copySel(),MOD+'+C'); it('Cut',()=>copySel(true),MOD+'+X'); if([...sel].some(q=>ED.props.includes(q))) it('Rotate 45°',()=>rotateSel(Math.PI/4),'R'); it('Zoom to',frameSel,'F'); it('Delete',deleteSel,'Del'); items.push('|'); }
  if(clip) it('Paste here',()=>pasteAt(tx-Math.floor(clip.w/2),ty-Math.floor(clip.h/2)),MOD+'+V');
  if(inMap(tx,ty)){ it(`Pick ground here (${TDESC[tileAt(tx,ty)]||tileAt(tx,ty)})`,()=>eyedrop(tx,ty,true)); it('Add NPC here',()=>{ begin('Add NPC'); const n={name:uniqueName('New villager'),title:'',x:tx,y:ty,col:NPCCOL[ED.npcs.length%NPCCOL.length],say:''}; ED.npcs.push(n); end(); setTool('select'); setSel([n]); focusField('iName'); });
    it(`Add ${mobName(ST.mob)} ×${ST.n} here`,()=>{ begin('Add '+mobName(ST.mob)); ED.spawns.push({mob:ST.mob,x:tx,y:ty,n:ST.n}); end(); }); it('Add landmark here',()=>{ begin('Add landmark'); const p={name:'New landmark',x:tx,y:ty,r:5}; ED.pois.push(p); end(); setTool('select'); setSel([p]); focusField('iName'); });
    items.push('|'); it(`Copy coordinates (${tx}, ${ty})`,()=>{ navigator.clipboard&&navigator.clipboard.writeText(`${tx}, ${ty}`); toast('Copied '+tx+', '+ty); }); }
  const c=document.createElement('div'); c.id='ctx'; c.innerHTML=items.map((m,i)=>m==='|'?'<div class="msep"></div>':`<div class="mi ${m.dis?'dis':''}" data-i="${i}" ${m.dis?'style="opacity:.75;font-weight:600"':''}><span>${esc(m.n)}</span><span class="k">${m.k||''}</span></div>`).join('');
  hideCtx(); document.body.appendChild(c); const r=c.getBoundingClientRect(); c.style.left=Math.min(cx,innerWidth-r.width-6)+'px'; c.style.top=Math.min(cy,innerHeight-r.height-6)+'px';
  c.querySelectorAll('.mi[data-i]').forEach(e=>e.onclick=()=>{ const m=items[+e.dataset.i]; hideCtx(); if(m.f) m.f(); }); }
function hideCtx(){ const c=$('ctx'); if(c) c.remove(); }

/* ---------- find and the command palette ---------- */
function quickOpen(init){ const o=document.createElement('div'); o.className='ovl'; o.innerHTML=`<div class="dlg qo"><input type="text" id="qoIn" placeholder="Find a place, NPC, landmark, monster or x, y… (type > for commands)" value="${esc(init)}"><div class="res" id="qoRes"></div></div>`;
  document.body.appendChild(o); dlgOpen++; const inp=o.querySelector('#qoIn'), res=o.querySelector('#qoRes'); let items=[], cur=0;
  const close=()=>{ o.remove(); dlgOpen--; };
  const search=()=>{ const q=inp.value.trim(), ql=q.replace(/^>/,'').trim().toLowerCase(); items=[];
    if(q.startsWith('>')){ for(const c of Object.values(CMDS)) if(!ql||c.name.toLowerCase().includes(ql)) items.push({ic:'⌘',n:c.name,k:keyLabel(c.key),run:c.run}); }
    else { const m=q.match(/^(\d+)\s*[, ]\s*(\d+)$/); if(m) items.push({ic:'📍',n:`Go to ${m[1]}, ${m[2]}`,k:'',run:()=>centerOn(+m[1]+.5,+m[2]+.5,Math.max(VIEW.z,10))});
      const has=s=>String(s||'').toLowerCase().includes(ql);
      if(ql){ for(const k of ['npcs','pois','spawns','props']) for(const x of ED[k]) if(has(objName(x,k))||(k==='npcs'&&has(x.title))) items.push({ic:KI[k],n:objName(x,k),k:`yours · ${Math.floor(x.x)}, ${Math.floor(x.y)}`,run:()=>{ setTool('select'); setSel([x]); frameSel(); }});
        for(const n of W.npcs) if(has(n.name)||has(n.title)) items.push({ic:'🟡',n:n.name+(n.title?' ‹'+n.title+'›':''),k:`NPC · ${n.x}, ${n.y}`,run:()=>centerOn(n.x+.5,n.y+.5,14)});
        for(const p of W.pois) if(has(p.name)) items.push({ic:'⭐',n:p.name,k:`landmark · ${p.x}, ${p.y}`,run:()=>centerOn(p.x+.5,p.y+.5,10)});
        for(const z in W.zones) if(has(W.zones[z])){ let sx=0,sy=0,c=0; for(let i=0;i<W.MW*W.OWH;i+=7) if(W.zmap[i]===z){ sx+=i%W.MW; sy+=Math.floor(i/W.MW); c++; } if(c) items.push({ic:'🗺',n:W.zones[z],k:'zone',run:()=>centerOn(sx/c,sy/c,4)}); }
        const seen=new Set(); for(const mt of W.mobTypes) if(has(mt.name)&&!seen.has(mt.key)){ seen.add(mt.key); const L=W.mobs.filter(q=>q[0]===mt.key); if(L.length) items.push({ic:'👹',n:mt.name,k:`${L.length} in the world · Lv ${mt.lv[0]}–${mt.lv[1]}`,run:()=>{ const q=L[(quickOpen.cyc=(quickOpen.cyc||0)+1)%L.length]; centerOn(q[1]+.5,q[2]+.5,12); }}); } }
      else items.push({ic:'💡',n:'Type a name, or x, y to jump there. Start with > for commands.',k:'',run:null}); }
    items=items.slice(0,80); cur=Math.min(cur,Math.max(0,items.length-1));
    res.innerHTML=items.map((it,i)=>`<div class="row ${i===cur?'on':''}" data-i="${i}"><span class="ic">${it.ic}</span><span class="nm">${esc(it.n)}</span><span class="k">${esc(it.k)}</span></div>`).join('')||'<p class="hint" style="padding:8px">Nothing found.</p>';
    res.querySelectorAll('.row').forEach(r=>{ r.onclick=()=>go(+r.dataset.i); r.onmousemove=()=>{ if(cur!==+r.dataset.i){ cur=+r.dataset.i; res.querySelectorAll('.row').forEach(x=>x.classList.toggle('on',+x.dataset.i===cur)); } }; }); };
  const go=i=>{ const it=items[i]; if(!it||!it.run) return; close(); it.run(); };
  inp.oninput=()=>{ cur=0; search(); }; inp.onkeydown=e=>{ if(e.key==='Escape'){ e.stopPropagation(); close(); } else if(e.key==='ArrowDown'||e.key==='ArrowUp'){ e.preventDefault(); cur=clamp(cur+(e.key==='ArrowDown'?1:-1),0,items.length-1); search(); const r=res.querySelector('.row.on'); if(r) r.scrollIntoView({block:'nearest'}); } else if(e.key==='Enter'){ e.preventDefault(); go(cur); } };
  o.addEventListener('mousedown',e=>{ if(e.target===o) close(); }); search(); inp.focus(); inp.setSelectionRange(inp.value.length,inp.value.length); }

/* ===================== files, versions, preview and publishing ===================== */
function download(name,text,type){ const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([text],{type})); a.download=name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),3000); }
const worldJs=()=>`/* Emberfall world edits, made with the World Editor on ${new Date().toISOString().slice(0,10)}.\n   Upload this file to your GitHub repository next to index.html, or use Publish in the editor. */\nwindow.WORLD_EDITS=${JSON.stringify(exportData())};\n`;
const parseWorld=txt=>{ const i=txt.indexOf('{'), j=txt.lastIndexOf('}'); if(i<0||j<i) throw new Error('no data'); const d=JSON.parse(txt.slice(i,j+1)); if(!d||typeof d!=='object') throw new Error('no data'); return d; };
const summary=d=>`${(d.tiles||[]).length} painted tiles, ${(d.zones||[]).length} zone cells, ${(d.props||[]).length} props, ${(d.npcs||[]).length} NPCs, ${(d.spawns||[]).length} monster groups and ${(d.pois||[]).length} landmarks`;
async function importWorld(d,from){ if(!editCount()){ begin('Open '+from); loadData(d,'replace',true); end(); toast('Opened '+from); return; }
  const v=await dlg({title:'Open '+from,html:`<p>This file has ${summary(d)}.</p><p>You already have ${editCount()} changes in the editor. Do you want to replace them, or add this file's edits to yours?</p>`,buttons:[{t:'Cancel',v:null},{t:'Add to mine',v:'merge'},{t:'Replace mine',v:'replace',pri:1}]});
  if(!v) return; begin(v==='merge'?'Merge '+from:'Open '+from); loadData(d,v,true); end(); toast(v==='merge'?'Added the edits from '+from:'Opened '+from); }
$('fOpen').onchange=async e=>{ const f=e.target.files[0]; e.target.value=''; if(!f) return; try{ await importWorld(parseWorld(await f.text()),f.name); }catch(err){ dlg({title:'Could not open the file',html:`<p>${esc(f.name)} is not an Emberfall world file (world.js or a .json backup).</p>`}); } };
async function loadLive(){ try{ const r=await fetch('world.js?t='+Date.now(),{cache:'no-store'}); if(!r.ok) throw 0; const d=parseWorld(await r.text()); await importWorld(d,'the live world'); }
  catch(e){ dlg({title:'No live world yet',html:'<p>Your realm does not have a world.js yet (or it could not be read). Make some changes and press <b>Publish</b> to create one.</p>'}); } }
// drag a world file onto the editor to open it
addEventListener('dragover',e=>{ e.preventDefault(); }); addEventListener('drop',async e=>{ e.preventDefault(); const f=e.dataTransfer.files&&e.dataTransfer.files[0]; if(!f||!W) return; try{ await importWorld(parseWorld(await f.text()),f.name); }catch(err){ toast(f.name+' is not a world file',1); } });

/* ---------- versions: named snapshots kept in this browser ---------- */
async function saveVersion(){ const n=await askDlg('Save a version','Give this version a name so you can come back to it later:',`${LS.get('ef_editor_name','')||'World'} – ${new Date().toLocaleString([], {month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'})}`); if(!n) return;
  const V=LS.get('ef_editor_versions',[]); V.unshift({n:n.slice(0,60),t:Date.now(),d:exportData(),c:editCount()}); while(V.length>20) V.pop();
  if(!LS.set('ef_editor_versions',V)){ V.pop(); if(!LS.set('ef_editor_versions',V.slice(0,5))) return dlg({title:'Not enough room',html:'<p>This browser has no room left for more versions. Delete old versions, or use File › Download a backup.</p>'}); } saveDraft(); toast('Saved version "'+n+'"'); }
function versionsDlg(){ const V=LS.get('ef_editor_versions',[]);
  const html=V.length?`<div class="list">${V.map((v,i)=>`<div class="row" style="cursor:default"><span class="nm"><b>${esc(v.n)}</b><br><span style="color:var(--dim);font-size:12px">${new Date(v.t).toLocaleString()} · ${v.c} changes</span></span><button data-o="${i}">Open</button><button data-d="${i}" class="danger">Delete</button></div>`).join('')}</div>`:'<p class="hint">No saved versions yet. Use File › Save a version (Ctrl+S) to keep a copy of your world that you can go back to.</p>';
  dlg({title:'Versions',html,buttons:[{t:'Close',v:null,pri:1}],onOpen:(o,close)=>{ o.querySelectorAll('[data-o]').forEach(b=>b.onclick=()=>{ const v=V[+b.dataset.o]; close(); begin('Open version '+v.n); loadData(v.d,'replace',true); end(); toast('Opened "'+v.n+'"'); });
    o.querySelectorAll('[data-d]').forEach(b=>b.onclick=async()=>{ const v=V[+b.dataset.d]; close(); if(await confirmDlg('Delete version?',`Delete "${esc(v.n)}"? This cannot be undone.`,'Delete',1)){ V.splice(+b.dataset.d,1); LS.set('ef_editor_versions',V); } versionsDlg(); }); }}); }

/* ---------- preview ---------- */
function preview(){ if(!LS.set('ef_world_preview',exportData())) return dlg({title:'Preview too big',html:'<p>Your world is too big to hand to the game through browser storage. Publish it instead.</p>'});
  LS.set('ef_world_preview_at',[Math.floor(VIEW.x),Math.floor(VIEW.y)]); window.open('index.html?preview=1','_blank'); toast('Opening the preview. You start where the map is centred.'); }

/* ---------- what changed ---------- */
function showChanges(){ const byT={}, byZ={}; for(const k in ED.tiles){ byT[ED.tiles[k]]=(byT[ED.tiles[k]]||0)+1; } for(const k in ED.zones){ byZ[ED.zones[k]]=(byZ[ED.zones[k]]||0)+1; }
  const byP={}; for(const p of ED.props) byP[p.k]=(byP[p.k]||0)+1; const byM={}; for(const s of ED.spawns) byM[s.mob]=(byM[s.mob]||0)+s.n;
  const tbl=(o,f)=>Object.entries(o).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<div><span>${f(k)}</span><b>${v}</b></div>`).join('');
  dlg({title:'Everything you changed',wide:1,html:editCount()?`
    ${Object.keys(byT).length?`<h4>Painted ground</h4><div class="sc">${tbl(byT,k=>esc(TDESC[k]||k))}</div>`:''}
    ${Object.keys(byZ).length?`<h4>Zones</h4><div class="sc">${tbl(byZ,k=>esc(zoneName(k)))}</div>`:''}
    ${ED.props.length?`<h4>Props</h4><div class="sc">${tbl(byP,k=>(PROPS[k]||['?',k]).join(' '))}</div>`:''}
    ${ED.spawns.length?`<h4>Monsters</h4><div class="sc">${tbl(byM,k=>esc(mobName(k)))}</div>`:''}
    ${ED.npcs.length?`<h4>NPCs</h4><div class="sc">${ED.npcs.map(n=>`<div><span>${esc(n.name)}${n.title?' ‹'+esc(n.title)+'›':''}</span><b>${n.x}, ${n.y}</b></div>`).join('')}</div>`:''}
    ${ED.pois.length?`<h4>Landmarks</h4><div class="sc">${ED.pois.map(p=>`<div><span>${esc(p.name||'(no name)')}</span><b>${p.x}, ${p.y}</b></div>`).join('')}</div>`:''}`:'<p>You have not changed anything yet.</p>',buttons:[{t:'Close',v:null,pri:1}]}); }

/* ---------- publish ---------- */
async function publishDlg(){ runChecks(); const errs=problems.filter(p=>p.sev==='err'), warns=problems.filter(p=>p.sev==='warn'); let info=null; try{ const r=await fetch('/api/world/info',{cache:'no-store'}); if(r.ok) info=await r.json(); }catch(e){}
  const canPub=info&&info.publish, gh=info&&info.github;
  const html=`<p>Your world: <b>${summary(exportData())}</b>.</p>
    ${errs.length?`<p class="warnline" style="color:var(--red)">⛔ ${errs.length} problem${errs.length>1?'s':''} will stop part of your world from loading. <a href="#" id="pbProb" style="color:var(--gold)">Show problems</a></p>`:warns.length?`<p class="warnline">⚠ ${warns.length} warning${warns.length>1?'s':''}. <a href="#" id="pbProb" style="color:var(--gold)">Show them</a></p>`:'<p style="color:var(--green)">✓ No problems found.</p>'}
    <div class="card"><div class="title">⚡ Publish to your realm</div>
      ${canPub?`<p class="hint" style="margin-top:0">Everyone who opens or reloads the game gets your world straight away. Uses your owner password (the one for <kbd>/gm login</kbd>).</p>
      <div class="fld"><span>Password</span><input type="password" id="pbPw" autocomplete="current-password" style="background:#0f0b08;border:1px solid var(--line2);border-radius:4px;padding:4px 7px;color:var(--txt)"></div>
      <label style="display:flex;gap:8px;align-items:flex-start;margin:8px 0"><input type="checkbox" id="pbGh" ${gh?'checked':'disabled'}><span>Also save it to GitHub${info.repo?' ('+esc(info.repo)+')':''}, so it stays after the realm restarts. <span style="color:var(--dim)">${gh?'Render redeploys afterwards, which restarts the realm for a moment.':'Needs a GitHub token on the server: see below.'}</span></span></label>
      <div class="btns"><button class="pri" id="pbGo">Publish now</button></div><div id="pbOut" class="hint"></div>`
      :`<p class="hint" style="margin-top:0">${info?'Publishing is off because this realm has no <b>GM_PASSWORD</b>. Add one in Render › Environment.':'Publishing works when the editor is opened from your realm (…onrender.com/play/editor.html).'}</p>`}</div>
    <div class="card"><div class="title">💾 Or upload it yourself</div><ol style="margin-bottom:6px"><li>Download <b>world.js</b>.</li><li>On GitHub, <b>Add file › Upload files</b> next to <code>index.html</code> and commit.</li><li>Render redeploys in 2–3 minutes.</li></ol>
      <div class="btns"><button id="pbDl">Download world.js</button><button id="pbCopy">Copy the code</button><button id="pbBk">Download a backup (.json)</button></div></div>
    ${canPub&&!gh?`<p class="hint">To keep published worlds after restarts automatically: in Render › Environment, set <b>WORLD_GITHUB_TOKEN</b> to a GitHub token with <b>Contents: Read and write</b> on your game repository.</p>`:''}`;
  dlg({title:'Publish your world',wide:1,html,buttons:[{t:'Close',v:null}],onOpen:(o,close)=>{
    const pp=o.querySelector('#pbProb'); if(pp) pp.onclick=e=>{ e.preventDefault(); close(); showBot('prob'); };
    o.querySelector('#pbDl').onclick=()=>{ download('world.js',worldJs(),'text/javascript'); toast('Downloaded world.js'); };
    o.querySelector('#pbCopy').onclick=()=>{ navigator.clipboard.writeText(worldJs()).then(()=>toast('Copied the world.js code'),()=>toast('Copying is blocked here. Use Download instead.',1)); };
    o.querySelector('#pbBk').onclick=()=>CMDS.backup.run();
    const go=o.querySelector('#pbGo'); if(go){ const pw=o.querySelector('#pbPw'); pw.focus(); pw.onkeydown=e=>{ if(e.key==='Enter'){ e.preventDefault(); e.stopPropagation(); go.click(); } };
      go.onclick=async()=>{ const out=o.querySelector('#pbOut'); if(!pw.value){ out.innerHTML='<span style="color:var(--amber)">Type your password first.</span>'; return pw.focus(); }
        go.disabled=true; out.textContent='Publishing…';
        try{ const r=await fetch('/api/world/publish',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({pw:pw.value,world:exportData(),github:o.querySelector('#pbGh').checked,who:LS.get('ef_editor_name','')})}); const j=await r.json().catch(()=>({ok:false,msg:'The server answered '+r.status}));
          if(!j.ok){ out.innerHTML=`<span style="color:var(--red)">${esc(j.msg||'Publishing failed.')}</span>`; go.disabled=false; return; }
          pw.value=''; LS.set('ef_editor_published',{t:Date.now(),c:editCount()});
          out.innerHTML=`<span style="color:var(--green)">✓ Published. Your world is live: reload the game to see it.</span>${j.github?`<br><span style="color:${j.github.ok?'var(--green)':'var(--amber)'}">${j.github.ok?'✓':'⚠'} ${esc(j.github.msg)}</span>${j.github.commit?` <a href="${esc(j.github.commit)}" target="_blank" style="color:var(--gold)">View the commit</a>`:''}`:''}`;
          toast('Your world is live'); go.disabled=false; }
        catch(e){ out.innerHTML='<span style="color:var(--red)">Could not reach the realm. Check your connection and try again.</span>'; go.disabled=false; } }; } }}); }

/* ---------- help ---------- */
function showWelcome(){ dlg({title:'Welcome to the World Editor',wide:1,html:`
  <p>Shape the world of Emberfall: paint ground and zones, place props, villagers, monsters and landmarks, then publish it to your realm.</p>
  <div class="sc" style="grid-template-columns:1fr 1fr;gap:10px 24px">
   <div style="display:block;border:0"><b>1. Find your way</b><br><span style="color:var(--dim)">Scroll to zoom, drag with the right mouse button (or hold Space) to move. Ctrl+F finds any NPC, landmark, zone or monster.</span></div>
   <div style="display:block;border:0"><b>2. Paint</b><br><span style="color:var(--dim)">Brush (B), Line (L), Rectangle (U) and Fill (G) paint ground or zones. Pick what to paint in the Palette on the right.</span></div>
   <div style="display:block;border:0"><b>3. Place</b><br><span style="color:var(--dim)">Props (P), NPCs (N), Monsters (M) and Landmarks (K). Select (V) to move, copy and edit them in the Inspector.</span></div>
   <div style="display:block;border:0"><b>4. Check and publish</b><br><span style="color:var(--dim)">The Problems tab lists anything the game would skip. Preview (Ctrl+P) to walk around, then Publish (Ctrl+E).</span></div></div>
  <p class="hint" style="margin-top:12px">Your work is saved in this browser as you go. Save named versions with Ctrl+S. Press ? for every shortcut.</p>`,buttons:[{t:'Keyboard shortcuts',v:'k'},{t:'Start editing',v:null,pri:1}]}).then(v=>{ if(v==='k') shortcutsDlg(); }); }
function shortcutsDlg(){ const L=[['Move the map','Right-drag · Space-drag · Arrows'],['Zoom','Wheel · + / −'],['Whole map / town','Home / T'],['Zoom to selection','F'],['Find / commands',MOD+'+F / '+MOD+'+K'],['Go to x, y',MOD+'+G'],
   ...TOOLS.filter(t=>t!=='|').map(t=>[t.name+' tool',t.key]),['Brush size','[ and ]'],['Ground ↔ zone painting','X'],['Pick ground (painting tools)','Alt+click'],['Rotate props','R / Shift+R'],['Nudge selection','Arrows (Shift: 5 tiles)'],['Add to selection','Shift+click'],['Copy while moving','Alt+drag'],
   ['Undo / redo',MOD+'+Z / '+(isMac?MOD+'+Shift+Z':MOD+'+Y')],['Copy / cut / paste',MOD+'+C / X / V'],['Duplicate',MOD+'+D'],['Select all',MOD+'+A'],['Delete','Del'],['Cancel / deselect','Esc'],['Zone colours','Z'],['Grid',MOD+"+'"],['Save version',MOD+'+S'],['Preview',MOD+'+P'],['Publish',MOD+'+E']];
  dlg({title:'Keyboard shortcuts',wide:1,html:`<div class="sc">${L.map(([a,b])=>`<div><span>${a}</span><span>${b.split(' · ').map(x=>`<kbd>${esc(x)}</kbd>`).join(' ')}</span></div>`).join('')}</div>`,buttons:[{t:'Close',v:null,pri:1}]}); }

/* ---------- start ---------- */
addEventListener('resize',layout);
addEventListener('beforeunload',()=>{ if(W){ clearTimeout(saveT); LS.set('ef_editor_draft',exportData()); } });
layout(); start();
</script></body></html>
