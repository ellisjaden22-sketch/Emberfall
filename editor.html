<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Emberfall World Editor</title>
<meta name="color-scheme" content="dark">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%234c8dff'/%3E%3Cpath d='M9 22V10h12M9 16h9M9 22h13' stroke='white' stroke-width='3' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
:root{
 --bg0:#141517;--bg1:#1c1d20;--bg2:#222327;--bg3:#2a2c30;--bg4:#33353a;
 --bd:#2f3135;--bd2:#3c3e44;--bd3:#4b4e55;
 --tx:#d8dade;--tx2:#9b9ea5;--tx3:#6c6f77;
 --ac:#4c8dff;--ac2:#3a78e8;--acbg:rgba(76,141,255,.16);--acbd:rgba(76,141,255,.55);
 --ok:#4fbf86;--warn:#e5b453;--err:#ef6b6b;--info:#6aa9ff;
 --font:"Inter","Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,sans-serif;
 --mono:"JetBrains Mono","Cascadia Mono","SF Mono",ui-monospace,Consolas,monospace;
 --lw:280px;--rw:300px;--bh:190px}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg0);color:var(--tx);font:12px/1.45 var(--font);overflow:hidden;user-select:none;-webkit-font-smoothing:antialiased}
input,textarea,select,button{font:inherit;color:inherit}
.mono{font-family:var(--mono);font-size:11px;font-variant-numeric:tabular-nums}
.ico{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none;display:block}
.ico.s{width:14px;height:14px}
/* controls */
.btn{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;border-radius:5px;border:1px solid var(--bd2);background:var(--bg3);color:var(--tx);cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--bg4);border-color:var(--bd3)}.btn:active{transform:translateY(.5px)}.btn:disabled{opacity:.4;cursor:default;transform:none}
.btn.pri{background:var(--ac);border-color:var(--ac);color:#fff;font-weight:600}.btn.pri:hover{background:var(--ac2)}
.btn.danger{color:#ffb3b3}.btn.danger:hover{border-color:var(--err);background:rgba(239,107,107,.12)}
.btn.sm{height:22px;padding:0 8px;font-size:11.5px}
.ib{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:5px;border:1px solid transparent;background:none;color:var(--tx2);cursor:pointer;padding:0;flex:none}
.ib:hover{background:var(--bg4);color:var(--tx)}.ib.on{color:var(--ac);background:var(--acbg)}.ib:disabled{opacity:.35;cursor:default;background:none}
.ib.sm{width:22px;height:22px}
.inp,textarea.inp,select.inp{height:26px;background:var(--bg0);border:1px solid var(--bd2);border-radius:5px;padding:0 8px;outline:none;min-width:0;width:100%;user-select:text}
textarea.inp{height:auto;padding:6px 8px;resize:vertical;line-height:1.45}
.inp:hover{border-color:var(--bd3)}.inp:focus{border-color:var(--ac);box-shadow:0 0 0 2px var(--acbg)}
select.inp{padding-right:4px}
input[type=number].inp{font-family:var(--mono);font-size:11.5px}
input[type=range]{accent-color:var(--ac);min-width:0;height:16px;margin:0}
input[type=checkbox]{accent-color:var(--ac);margin:0}
input[type=color].inp{padding:2px;width:40px;cursor:pointer}
.seg{display:inline-flex;background:var(--bg0);border:1px solid var(--bd2);border-radius:5px;padding:2px;gap:2px}
.seg button{border:0;background:none;color:var(--tx2);height:20px;padding:0 9px;border-radius:3px;cursor:pointer;display:inline-flex;align-items:center;gap:5px}
.seg button:hover{color:var(--tx)}.seg button.on{background:var(--bg4);color:var(--tx);box-shadow:0 1px 2px #0006}
kbd{display:inline-block;min-width:18px;text-align:center;background:var(--bg0);border:1px solid var(--bd2);border-radius:4px;padding:0 5px;font:10.5px/17px var(--mono);color:var(--tx2)}
/* frame */
#app{display:flex;flex-direction:column;height:100%}
#titlebar{height:38px;flex:none;display:flex;align-items:center;gap:4px;padding:0 8px 0 10px;background:var(--bg1);border-bottom:1px solid var(--bd)}
.brand{display:flex;align-items:center;gap:8px;font-weight:650;letter-spacing:.1px;margin-right:6px;white-space:nowrap}
.brand i{width:20px;height:20px;border-radius:5px;background:var(--ac);display:grid;place-items:center;color:#fff}
.brand span{color:var(--tx3);font-weight:500}
#menus{display:flex}.menu{position:relative}
.menu>button{border:0;background:none;padding:0 9px;height:26px;border-radius:4px;cursor:pointer;color:var(--tx2)}
.menu>button:hover,.menu.open>button{background:var(--bg3);color:var(--tx)}
.drop{position:absolute;left:0;top:calc(100% + 4px);min-width:270px;background:var(--bg2);border:1px solid var(--bd2);border-radius:7px;padding:4px;box-shadow:0 12px 32px #000a;z-index:60;display:none}
.menu.open .drop{display:block}
.mi{display:flex;align-items:center;gap:8px;height:26px;padding:0 8px;border-radius:4px;cursor:pointer;white-space:nowrap;color:var(--tx)}
.mi:hover{background:var(--ac);color:#fff}.mi:hover .k{color:#ffffffc0}
.mi .k{margin-left:auto;padding-left:20px;color:var(--tx3);font:10.5px var(--mono)}
.mi .chk{width:14px;display:grid;place-items:center;color:var(--ac)}.mi:hover .chk{color:#fff}
.mi.dis{opacity:.38;pointer-events:none}.mi.head{color:var(--tx3);font-size:11px;pointer-events:none;height:22px}
.msep{height:1px;background:var(--bd);margin:4px 2px}
#docTitle{flex:1;display:flex;justify-content:center;align-items:center;gap:8px;color:var(--tx2);min-width:0;white-space:nowrap;overflow:hidden}
#docTitle b{color:var(--tx);font-weight:550;overflow:hidden;text-overflow:ellipsis}#docTitle .dot{width:7px;height:7px;border-radius:50%;background:var(--warn);display:none}#docTitle.dirty .dot{display:block}
#docTitle .src{color:var(--tx3)}
.tbr{display:flex;align-items:center;gap:6px}
.vsep{width:1px;height:18px;background:var(--bd2);margin:0 4px;flex:none}
#body{flex:1;display:flex;min-height:0}
#tools{width:44px;flex:none;background:var(--bg1);border-right:1px solid var(--bd);display:flex;flex-direction:column;align-items:center;padding:6px 0;gap:2px;overflow-y:auto}
#tools .ib{width:32px;height:32px;border-radius:6px;color:var(--tx2)}
#tools .ib.on{background:var(--ac);color:#fff}
#tools .sep{width:22px;height:1px;background:var(--bd2);margin:5px 0}
.dock{flex:none;background:var(--bg1);display:flex;flex-direction:column;min-width:0;min-height:0}
#left{width:var(--lw);border-right:1px solid var(--bd)}#right{width:var(--rw);border-left:1px solid var(--bd)}
.split{flex:none;width:4px;margin:0 -2px;cursor:col-resize;z-index:5;position:relative}.split:hover,.split.drag{background:var(--ac)}
.split.h{width:auto;height:4px;margin:-2px 0;cursor:row-resize}
#center{flex:1;display:flex;flex-direction:column;min-width:0;min-height:0}
.ptabs{height:32px;flex:none;display:flex;align-items:stretch;background:var(--bg2);border-bottom:1px solid var(--bd);padding:0 4px}
.ptabs>button{border:0;background:none;color:var(--tx3);padding:0 10px;cursor:pointer;display:flex;align-items:center;gap:6px;border-bottom:2px solid transparent;margin-bottom:-1px;font-weight:550;letter-spacing:.2px;text-transform:uppercase;font-size:10.5px}
.ptabs>button:hover{color:var(--tx)}.ptabs>button.on{color:var(--tx);border-bottom-color:var(--ac)}
.ptabs .sp{flex:1}.ptabs .acts{display:flex;align-items:center;gap:2px}
.badge{display:inline-grid;place-items:center;min-width:16px;height:16px;padding:0 4px;border-radius:8px;background:var(--bg4);color:var(--tx2);font:600 10px var(--mono);text-transform:none}
.badge.err{background:rgba(239,107,107,.2);color:#ffb3b3}.badge.warn{background:rgba(229,180,83,.18);color:#f3d08a}.badge.ac{background:var(--acbg);color:#a9c8ff}
.pbody{flex:1;overflow:auto;min-height:0}
/* document bar and options bar */
#docbar{height:34px;flex:none;display:flex;align-items:center;gap:2px;background:var(--bg1);border-bottom:1px solid var(--bd);padding:0 6px 0 0}
.dtab{height:100%;display:flex;align-items:center;gap:7px;padding:0 14px;background:var(--bg0);border-right:1px solid var(--bd);border-top:2px solid var(--ac);color:var(--tx);font-weight:500}
.dtab .dot{width:7px;height:7px;border-radius:50%;background:var(--warn);display:none}.dtab.dirty .dot{display:block}
#docbar .sp{flex:1}
.zoom{display:flex;align-items:center;gap:2px;margin-left:4px}.zoom span{min-width:48px;text-align:center;color:var(--tx2);cursor:pointer;border-radius:4px;height:22px;line-height:22px}.zoom span:hover{background:var(--bg3)}
#optbar{height:38px;flex:none;display:flex;align-items:center;gap:12px;padding:0 12px;background:var(--bg2);border-bottom:1px solid var(--bd);overflow-x:auto;overflow-y:hidden;white-space:nowrap}
#optbar .tname{display:flex;align-items:center;gap:7px;font-weight:600;min-width:104px;color:var(--tx)}
#optbar .tname .ico{color:var(--ac)}
#optbar label{display:flex;align-items:center;gap:7px;color:var(--tx2)}#optbar label b{color:var(--tx);font:500 11px var(--mono);min-width:30px}
#optbar input[type=range]{width:96px}
#optbar .vs{width:1px;height:20px;background:var(--bd2);flex:none}
#optbar .note{color:var(--tx3)}#optbar .asset{display:flex;align-items:center;gap:7px;color:var(--tx2)}#optbar .asset b{color:var(--tx);font-weight:500}
.sw{display:inline-block;width:14px;height:14px;border-radius:3px;border:1px solid #0008;flex:none;box-shadow:inset 0 0 0 1px #ffffff14}
/* viewport */
#vpwrap{flex:1;display:grid;grid-template-columns:20px 1fr;grid-template-rows:20px 1fr;min-height:0;background:var(--bg0)}
#rc{background:var(--bg2);border-right:1px solid var(--bd);border-bottom:1px solid var(--bd)}
#rx,#ry{display:block;width:100%;height:100%;background:var(--bg2)}#rx{border-bottom:1px solid var(--bd)}#ry{border-right:1px solid var(--bd)}
#view{position:relative;overflow:hidden;min-width:0;min-height:0}
#cv{display:block;width:100%;height:100%;touch-action:none;outline:none}
#mini{position:absolute;right:10px;bottom:10px;border:1px solid var(--bd2);border-radius:6px;background:#000;box-shadow:0 6px 18px #0009;cursor:pointer}
#hoverTip{position:absolute;pointer-events:none;background:var(--bg2);border:1px solid var(--bd2);border-radius:5px;padding:3px 8px;display:none;white-space:nowrap;z-index:3;box-shadow:0 4px 12px #0008}
#hoverTip small{color:var(--tx3);margin-right:6px}
#banner{position:absolute;left:50%;top:10px;transform:translateX(-50%);background:var(--bg2);border:1px solid var(--warn);border-radius:7px;padding:7px 10px 7px 12px;display:flex;gap:10px;align-items:center;box-shadow:0 8px 24px #000a;z-index:4;max-width:90%}
#banner .ico{color:var(--warn)}
/* bottom panel */
#bottom{height:var(--bh);flex:none;background:var(--bg1);border-top:1px solid var(--bd);display:flex;flex-direction:column;min-height:0}
#bottom.hidden,#left.hidden,#right.hidden{display:none}
/* status bar */
#status{height:24px;flex:none;display:flex;align-items:center;background:var(--bg1);border-top:1px solid var(--bd);color:var(--tx2);font-size:11.5px;white-space:nowrap;overflow:hidden}
#status>span{display:flex;align-items:center;gap:6px;padding:0 10px;height:100%;border-right:1px solid var(--bd)}
#status>span.r{border-right:0;border-left:1px solid var(--bd)}
#status .clk{cursor:pointer}#status .clk:hover{background:var(--bg3);color:var(--tx)}
#status .grow{flex:1;overflow:hidden;text-overflow:ellipsis;display:block;line-height:24px;border-right:0;color:var(--tx3)}
#stRealm .led{width:7px;height:7px;border-radius:50%;background:var(--tx3)}#stRealm.on .led{background:var(--ok);box-shadow:0 0 6px var(--ok)}#stRealm.off .led{background:var(--tx3)}
#stSave.dirty{color:var(--warn)}
/* panel content */
.sec{border-bottom:1px solid var(--bd)}
.sech{height:30px;display:flex;align-items:center;gap:6px;padding:0 8px 0 6px;cursor:pointer;color:var(--tx2);font-weight:600;font-size:11px;letter-spacing:.3px;text-transform:uppercase}
.sech:hover{color:var(--tx)}.sech .ico{transition:transform .12s}.sec.closed .sech .chev{transform:rotate(-90deg)}.sech .sp{flex:1}
.secb{padding:4px 12px 12px}.sec.closed .secb{display:none}
.prow{display:grid;grid-template-columns:84px 1fr;align-items:center;gap:8px;min-height:30px}
.prow>label{color:var(--tx2)}.prow .two{display:grid;grid-template-columns:1fr 1fr;gap:6px}.prow .two .ax{position:relative}.prow .two .ax i{position:absolute;left:7px;top:5px;font:600 10px var(--mono);color:var(--tx3);font-style:normal}.prow .two .ax .inp{padding-left:20px}
.prow .rr{display:flex;align-items:center;gap:8px}.prow .rr input[type=range]{flex:1;width:0}.prow .rr .inp{width:64px;flex:none}
.prow.top{align-items:start;padding-top:4px}
.hint{color:var(--tx3);margin:6px 0;line-height:1.5}
.note{display:flex;gap:8px;align-items:flex-start;padding:7px 9px;border-radius:5px;background:rgba(229,180,83,.1);border:1px solid rgba(229,180,83,.3);color:#f0d49a;margin:8px 0}
.note.err{background:rgba(239,107,107,.1);border-color:rgba(239,107,107,.35);color:#ffc0c0}.note.ok{background:rgba(79,191,134,.1);border-color:rgba(79,191,134,.35);color:#a9e6c6}
.note .ico{margin-top:1px}
.kv{display:flex;justify-content:space-between;gap:10px;padding:3px 0;color:var(--tx2)}.kv b{color:var(--tx);font:500 11px var(--mono)}
.acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.swatches{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px}.swatches span{width:18px;height:18px;border-radius:4px;border:1px solid #0009;cursor:pointer;box-shadow:inset 0 0 0 1px #ffffff18}.swatches span:hover{outline:2px solid var(--ac);outline-offset:1px}
.search{position:relative;padding:8px}.search .ico{position:absolute;left:16px;top:13px;color:var(--tx3)}.search .inp{padding-left:28px}
/* tree */
.tree{padding:2px 0 8px}
.tr{display:flex;align-items:center;gap:6px;height:24px;padding:0 6px 0 calc(6px + var(--d,0)*16px);cursor:pointer;color:var(--tx);white-space:nowrap}
.tr:hover{background:var(--bg3)}.tr.on{background:var(--acbg);box-shadow:inset 2px 0 0 var(--ac)}
.tr .nm{flex:1;overflow:hidden;text-overflow:ellipsis}.tr .nm em{font-style:normal;color:var(--tx3)}
.tr .xy{color:var(--tx3)}.tr .ct{color:var(--tx3);font:10.5px var(--mono)}
.tr.grp{font-weight:600;color:var(--tx2)}.tr.grp .chev{transition:transform .12s}.tr.grp.closed .chev{transform:rotate(-90deg)}
.tr .gl{width:16px;text-align:center;font-size:13px;line-height:1}
.tr .ib{opacity:0;width:20px;height:20px}.tr:hover .ib,.tr .ib.lit{opacity:1}
.tr .warnI{color:var(--warn)}
.tr.dim .nm{color:var(--tx3)}
.more{padding:4px 12px 4px 46px;color:var(--tx3)}
/* assets */
.afilter{display:flex;gap:4px;padding:0 8px 6px;flex-wrap:wrap}
.afilter button{border:1px solid var(--bd2);background:none;color:var(--tx2);height:22px;padding:0 9px;border-radius:11px;cursor:pointer;font-size:11.5px}
.afilter button:hover{color:var(--tx);border-color:var(--bd3)}.afilter button.on{background:var(--acbg);border-color:var(--acbd);color:#cfe0ff}
.agrp{padding:6px 12px 2px;color:var(--tx3);font-size:10.5px;font-weight:600;letter-spacing:.4px;text-transform:uppercase}
.agrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(76px,1fr));gap:6px;padding:4px 8px 8px}
.acard{border:1px solid var(--bd);background:var(--bg2);border-radius:6px;padding:6px 4px 5px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;min-width:0}
.acard:hover{border-color:var(--bd3);background:var(--bg3)}.acard.on{border-color:var(--ac);background:var(--acbg)}
.acard .th{width:34px;height:34px;border-radius:5px;display:grid;place-items:center;font-size:22px;line-height:1;box-shadow:inset 0 0 0 1px #ffffff12}
.acard .nm{font-size:11px;line-height:1.25;color:var(--tx);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;width:100%}
.acard .sub{font-size:10px;color:var(--tx3);margin-top:-3px}
.alist .tr{height:28px}
/* bottom lists */
.blist .tr{height:26px;padding-left:12px}.blist .tr .sev{width:16px;display:grid;place-items:center}
.sev.err{color:var(--err)}.sev.warn{color:var(--warn)}.sev.info{color:var(--info)}
.out .ln{display:flex;gap:10px;padding:2px 12px;font:11px/1.6 var(--mono);color:var(--tx2)}.out .ln .t{color:var(--tx3)}.out .ln.ok{color:#9fdcbc}.out .ln.err{color:#ffaaaa}.out .ln.warn{color:#f0d49a}
.empty{padding:16px;color:var(--tx3);display:flex;gap:8px;align-items:center}
/* overlays */
.ovl{position:fixed;inset:0;background:rgba(5,6,8,.55);display:flex;align-items:flex-start;justify-content:center;z-index:100;padding-top:10vh;backdrop-filter:blur(1px)}
.dlg{background:var(--bg1);border:1px solid var(--bd2);border-radius:10px;box-shadow:0 24px 64px #000c;width:min(540px,94vw);max-height:80vh;display:flex;flex-direction:column}
.dlg header{height:44px;padding:0 8px 0 16px;border-bottom:1px solid var(--bd);font-weight:600;font-size:13px;display:flex;align-items:center;gap:8px}
.dlg header .ib{margin-left:auto}
.dlg .db{padding:16px;overflow:auto;user-select:text;line-height:1.55}.dlg footer{padding:12px 16px;border-top:1px solid var(--bd);display:flex;gap:8px;justify-content:flex-end;background:var(--bg2);border-radius:0 0 10px 10px}
.dlg p{margin:0 0 10px}.dlg ol,.dlg ul{margin:0 0 10px;padding-left:20px}.dlg li{margin:3px 0}.dlg h4{margin:14px 0 6px;color:var(--tx2);font-size:11px;letter-spacing:.3px;text-transform:uppercase}
.dlg code{font:11px var(--mono);background:var(--bg0);border:1px solid var(--bd);padding:1px 5px;border-radius:4px}
.card{border:1px solid var(--bd);border-radius:7px;padding:12px;background:var(--bg2);margin-bottom:10px}.card .title{font-weight:600;margin-bottom:6px;display:flex;align-items:center;gap:8px}
.qo{width:min(640px,94vw)}.qo .qi{display:flex;align-items:center;gap:8px;padding:0 14px;border-bottom:1px solid var(--bd)}.qo .qi .ico{color:var(--tx3)}
.qo input{flex:1;height:44px;border:0;background:none;outline:none;font-size:14px}
.qo .res{max-height:52vh;overflow:auto;padding:4px}.qo .tr{height:30px;border-radius:5px;padding:0 8px}.qo .tr.on{background:var(--ac);color:#fff}.qo .tr.on .xy{color:#ffffffc0}
.sc{display:grid;grid-template-columns:1fr 1fr;gap:2px 28px}.sc div{display:flex;justify-content:space-between;gap:10px;padding:4px 0;border-bottom:1px solid var(--bd)}
.welcome{display:grid;grid-template-columns:1fr 1fr;gap:18px}.welcome .col h4:first-child{margin-top:0}
.wl{display:flex;align-items:center;gap:10px;padding:7px 8px;border-radius:6px;cursor:pointer;color:var(--tx)}.wl:hover{background:var(--bg3)}.wl .ico{color:var(--ac)}.wl small{display:block;color:var(--tx3)}
#ctx{position:fixed;z-index:120;background:var(--bg2);border:1px solid var(--bd2);border-radius:7px;padding:4px;box-shadow:0 12px 32px #000a;min-width:230px}
#tip{position:fixed;z-index:140;pointer-events:none;background:var(--bg4);border:1px solid var(--bd3);border-radius:5px;padding:4px 8px;box-shadow:0 6px 16px #000a;display:none;white-space:nowrap}
#tip kbd{margin-left:8px}
#toasts{position:fixed;right:14px;bottom:34px;display:flex;flex-direction:column;gap:8px;align-items:flex-end;z-index:99;pointer-events:none}
.toast{min-width:240px;max-width:420px;background:var(--bg2);border:1px solid var(--bd2);border-radius:7px;padding:9px 12px;box-shadow:0 10px 28px #000b;display:flex;gap:9px;align-items:flex-start;animation:tin .16s ease-out}
.toast .ico{color:var(--ac);margin-top:1px}.toast.err .ico{color:var(--err)}.toast.ok .ico{color:var(--ok)}
@keyframes tin{from{opacity:0;transform:translateY(6px)}}
#loading{position:fixed;inset:0;background:var(--bg0);display:flex;align-items:center;justify-content:center;z-index:200;flex-direction:column;gap:14px;color:var(--tx2)}

/* ---------- the map ---------- */

/* ---------- the document ---------- */

/* ---------- undo, redo and history ---------- */

const toScr=(x,y)=>[(x-VIEW.x)*VIEW.z+CW/2,(y-VIEW.y)*VIEW.z+CH/2];

  buildOptbar(); toolChanged(quiet); $('stHint').textContent=toolById(t).hint; draw(); }

/* ---------- the options bar above the map ---------- */
function buildOptbar(){ const t=ST.tool, T=toolById(t); let h=`<div class="tname">${svg(t)}${T.name}</div>`;
  const rng=(id,lab,min,max,val,step=1,fmt=v=>v)=>`<label>${lab}<input type="range" id="${id}" min="${min}" max="${max}" step="${step}" value="${val}"><b id="${id}v">${fmt(val)}</b></label>`;
  const chk=(id,lab,on)=>`<label><input type="checkbox" id="${id}" ${on?'checked':''}>${lab}</label>`;
  const seg=(id,opts,cur)=>`<div class="seg" id="${id}">${opts.map(([v,n])=>`<button data-v="${v}" class="${cur===v?'on':''}">${n}</button>`).join('')}</div>`;
  const layerSeg=()=>seg('oLayer',[['tile','Ground'],['zone','Zone']],ST.layer)+'<div class="vs"></div>';
  const brushOpts=()=>rng('oBr','Size',1,15,ST.brush,1,v=>v*2-1)+seg('oShape',[['circle','● Round'],['square','■ Square']],ST.shape);
  const asset=()=>`<div class="vs"></div><span class="asset"><i class="sw" style="background:${ST.layer==='zone'?(ZCOL[ST.zone]||'#888'):TCOL[ST.tile]}"></i><b>${ST.layer==='zone'?esc(zoneName(ST.zone)):esc(TDESC[ST.tile]||ST.tile)}</b></span>`;
  if(t==='brush'||t==='line') h+=layerSeg()+brushOpts()+asset();
  else if(t==='rect') h+=layerSeg()+chk('oFilled','Filled',ST.filled)+asset();
  else if(t==='fill') h+=layerSeg()+rng('oLim','Max size',500,20000,ST.fillLimit,500,v=>v)+asset();
  else if(t==='erase') h+=chk('oErT','Ground',ST.erT)+chk('oErZ','Zones',ST.erZ)+chk('oErO','Objects',ST.erO)+'<div class="vs"></div>'+brushOpts();
  else if(t==='prop') h+=`<label>Rotation<input type="range" id="oRot" min="0" max="345" step="15" value="${Math.round(ST.rot*180/Math.PI)}"><b id="oRotv">${Math.round(ST.rot*180/Math.PI)}°</b></label>`+chk('oRR','Random',ST.rndRot)+'<div class="vs"></div>'+rng('oSc','Size',40,250,Math.round(ST.scale*100),5,v=>v+'%')+rng('oRS','Vary',0,60,ST.rndScale,5,v=>'±'+v+'%')+'<div class="vs"></div>'+chk('oScat','Scatter',ST.scatter)+(ST.scatter?rng('oBr','Area',1,10,ST.brush)+rng('oDen','Density',1,10,ST.density):'')+'<div class="vs"></div>'+chk('oSnap','Snap to ½ tile',ST.snap);
  else if(t==='spawn') h+=rng('oN','Group size',1,12,ST.n)+`<div class="vs"></div><span class="asset">${I('box','s')}<b>${esc(mobName(ST.mob))}</b></span>`;
  else if(t==='prop') h+=`<div class="vs"></div><span class="asset" style="font-size:15px">${PROPS[ST.prop][0]}<b style="font-size:12px">${PROPS[ST.prop][1]}</b></span>`;
  else if(t==='select') h+=chk('oSnap','Snap props to ½ tile',ST.snap)+'<div class="vs"></div><button class="btn sm" id="oAll">Select all</button><button class="btn sm" id="oNone">Select none</button>'+(sel.size?`<div class="vs"></div><span class="note" style="margin:0;padding:2px 8px;background:var(--acbg);border-color:var(--acbd);color:#cfe0ff">${sel.size} selected</span><button class="btn sm" id="oDup">${I('copy','s')}Duplicate</button><button class="btn sm danger" id="oDel">${I('trash','s')}Delete</button>`:'');
  else if(t==='measure') h+='<span class="note" style="margin:0;padding:2px 8px;background:none;border:0;color:var(--tx3)">Drag on the map. Players walk about 6 tiles a second.</span>';
  else h+=`<span style="color:var(--tx3)">${T.hint}</span>`;
  const o=$('optbar'); o.innerHTML=h;
  const bind=(id,f,ev='input')=>{ const e=$(id); if(e) e.addEventListener(ev,()=>{ f(e.type==='checkbox'?e.checked:+e.value,e); savePrefs(); draw(); }); };
  const showv=(id,v)=>{ const e=$(id+'v'); if(e) e.textContent=v; };
  bind('oBr',v=>{ ST.brush=v; showv('oBr',ST.tool==='prop'?v:v*2-1); }); bind('oLim',v=>{ ST.fillLimit=v; showv('oLim',v); }); bind('oFilled',v=>ST.filled=v,'change');
  bind('oErT',v=>ST.erT=v,'change'); bind('oErZ',v=>ST.erZ=v,'change'); bind('oErO',v=>ST.erO=v,'change');
  bind('oRot',v=>{ ST.rot=v*Math.PI/180; showv('oRot',v+'°'); }); bind('oRR',v=>ST.rndRot=v,'change'); bind('oSc',v=>{ ST.scale=v/100; showv('oSc',v+'%'); }); bind('oRS',v=>{ ST.rndScale=v; showv('oRS','±'+v+'%'); });
  bind('oScat',v=>{ ST.scatter=v; buildOptbar(); },'change'); bind('oDen',v=>{ ST.density=v; showv('oDen',v); }); bind('oSnap',v=>ST.snap=v,'change');
  bind('oN',v=>{ ST.n=v; showv('oN',v); });
  o.querySelectorAll('.seg').forEach(sg=>sg.querySelectorAll('button').forEach(b=>b.onclick=()=>{ if(sg.id==='oLayer') ST.layer=b.dataset.v; else if(sg.id==='oShape') ST.shape=b.dataset.v; savePrefs(); buildOptbar(); renderTop(); draw(); }));
  if($('oAll')) $('oAll').onclick=selectAll; if($('oNone')) $('oNone').onclick=()=>setSel([]); if($('oDup')) $('oDup').onclick=()=>duplicateSel(); if($('oDel')) $('oDel').onclick=deleteSel; }

/* ---------- editing operations ---------- */
const snapP=p=>ST.snap?[Math.round(p[0]*2)/2,Math.round(p[1]*2)/2]:[+p[0].toFixed(2),+p[1].toFixed(2)];
function paintCells(cells){ let n=0; for(const [x,y] of cells) n+=(ST.layer==='zone'?setZone(x,y,ST.zone):setTile(x,y,ST.tile))?1:0; if(n) draw(); return n; }
function eraseCells(cells,cx,cy){ let n=0; for(const [x,y] of cells){ const k=x+','+y; if(ST.erT&&ED.tiles[k]!==undefined){ setTile(x,y,baseTile(x,y)); n++; } if(ST.erZ&&ED.zones[k]!==undefined){ setZone(x,y,W.zmap[y*W.MW+x]); n++; } }
  if(ST.erO){ const R=Math.max(ST.brush-.5,.7); for(const k of KINDS){ if(!LAY[k].v||LAY[k].l) continue; const keep=ED[k].filter(o=>{ const [x,y]=objPos(o,k); return Math.hypot(x-cx,y-cy)>R; }); if(keep.length!==ED[k].length){ n+=ED[k].length-keep.length; for(const o of ED[k]) if(!keep.includes(o)) sel.delete(o); ED[k]=keep; } } }
  if(n) draw(); return n; }
function floodFill(x0,y0){ if(!inMap(x0,y0)) return 0; const zone=ST.layer==='zone', get=zone?zoneAt:tileAt, from=get(x0,y0), to=zone?ST.zone:ST.tile; if(from===to) return 0;
  const seen=new Uint8Array(W.MW*W.OWH), q=[[x0,y0]], cells=[]; seen[y0*W.MW+x0]=1;
  while(q.length){ const [x,y]=q.pop(); cells.push([x,y]); if(cells.length>=ST.fillLimit) break; for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){ const nx=x+dx, ny=y+dy; if(!inMap(nx,ny)||seen[ny*W.MW+nx]) continue; seen[ny*W.MW+nx]=1; if(get(nx,ny)===from) q.push([nx,ny]); } }
  const n=paintCells(cells); if(cells.length>=ST.fillLimit) toast(`Filled ${cells.length} tiles and stopped at the size limit. Raise "Max size" to fill more.`); return n; }
function placeProp(x,y){ if(ED.props.length>=MAXPROPS){ toast(`The game shows at most ${MAXPROPS} props.`,1); return null; }
  const vary=ST.rndScale/100, s=clamp(ST.scale*(1+(Math.random()*2-1)*vary),.3,4), r=ST.rndRot?Math.random()*Math.PI*2:ST.rot;
  const p={k:ST.prop,x:clamp(x,1,W.MW-1),y:clamp(y,1,W.OWH-1),r:+r.toFixed(2),s:+s.toFixed(2)}; ED.props.push(p); return p; }
function setSel(list,add){ if(!add) sel.clear(); for(const o of list) sel.add(o); if(ST.tool==='select') buildOptbar(); selChanged(); draw(); updateStatus(); }
function selectAll(){ const L=[]; for(const k of KINDS) if(LAY[k].v&&!LAY[k].l) L.push(...ED[k]); if(ST.tool!=='select') setTool('select'); setSel(L); toast(`Selected ${L.length} objects`); }
function deleteSel(){ if(!sel.size) return; begin(`Delete ${sel.size>1?sel.size+' objects':objName([...sel][0])}`); for(const k of KINDS) ED[k]=ED[k].filter(o=>!sel.has(o)); sel.clear(); end(); setSel([]); }
function cloneObj(o){ return JSON.parse(JSON.stringify(o)); }
function duplicateSel(dx=1,dy=1){ if(!sel.size) return; begin('Duplicate'); const out=[]; for(const o of sel){ const k=kindOf(o); if(k==='props'&&ED.props.length>=MAXPROPS) break; const c=cloneObj(o); c.x+=dx; c.y+=dy; if(k==='npcs') c.name=uniqueName(c.name); ED[k].push(c); out.push(c); } end(); setSel(out); }
function uniqueName(n){ const names=new Set(ED.npcs.map(q=>q.name)); if(!names.has(n)) return n; const b=n.replace(/ \d+$/,''); for(let i=2;i<999;i++) if(!names.has(b+' '+i)) return (b+' '+i).slice(0,28); return n; }
function nudge(dx,dy){ if(!sel.size) return; begin('Move'); for(const o of sel){ o.x+=dx; o.y+=dy; } end(); draw(); renderTop(); }
function rotateSel(a){ const P=[...sel].filter(o=>ED.props.includes(o)); if(!P.length){ ST.rot=((ST.rot+a)%(2*Math.PI)+2*Math.PI)%(2*Math.PI); buildOptbar(); draw(); return; } begin('Rotate'); for(const p of P) p.r=+((((p.r||0)+a)%(2*Math.PI)+2*Math.PI)%(2*Math.PI)).toFixed(3); end(); renderTop(); }
/* copy: the selected objects, plus the ground inside the box you dragged */
function copySel(cut){ let objs=[...sel], tiles=[], a=1e9,b=1e9,c=-1e9,d=-1e9;
  if(selRect){ a=selRect.x0; b=selRect.y0; c=selRect.x1; d=selRect.y1; }
  for(const o of objs){ const [x,y]=objPos(o); a=Math.min(a,Math.floor(x)); b=Math.min(b,Math.floor(y)); c=Math.max(c,Math.floor(x)); d=Math.max(d,Math.floor(y)); }
  if(!objs.length&&!selRect) return toast('Select something first. Drag a box with the Select tool to copy ground too.');
  if(selRect){ if((c-a+1)*(d-b+1)>128*128) return toast('That area is too big to copy (at most 128 × 128 tiles).',1); for(let y=selRect.y0;y<=selRect.y1;y++) for(let x=selRect.x0;x<=selRect.x1;x++) tiles.push([x-a,y-b,tileAt(x,y)]); }
  clip={w:c-a+1,h:d-b+1,tiles,objs:objs.map(o=>{ const k=kindOf(o), d0=cloneObj(o); d0.x-=a; d0.y-=b; return {kind:k,d:d0}; })}; LS.set('ef_editor_clip',clip);
  toast(`Copied ${objs.length} object${objs.length===1?'':'s'}${tiles.length?` and ${tiles.length} tiles of ground`:''}`);
  if(cut){ begin('Cut'); for(const k of KINDS) ED[k]=ED[k].filter(o=>!sel.has(o)); sel.clear(); end(); setSel([]); } }
function startPaste(){ if(!clip) return toast('The clipboard is empty. Copy something first (Ctrl+C).'); if(ST.tool!=='select') setTool('select'); pasteMode=true; $('stHint').textContent='Click where the copy should go. Shift-click to keep pasting, Esc to stop.'; cv.style.cursor='copy'; draw(); }
function pasteAt(x,y){ begin('Paste'); const out=[]; for(const [dx,dy,t] of clip.tiles||[]) if(W.T[t]!=null) setTile(x+dx,y+dy,t);
  for(const o of clip.objs||[]){ if(o.kind==='props'&&ED.props.length>=MAXPROPS) continue; const c=cloneObj(o.d); c.x+=x; c.y+=y; if(o.kind==='npcs') c.name=uniqueName(c.name); ED[o.kind].push(c); out.push(c); }
  end(); setSel(out); }

/* ---------- picking objects on the map ---------- */
function pick(x,y,all){ const R=Math.max(.7,11/VIEW.z); let best=null,bd=R; const hits=[];
  for(const k of ['npcs','spawns','pois','props']){ if(!LAY[k].v||LAY[k].l) continue; for(const o of ED[k]){ const [ox,oy]=objPos(o,k), d=Math.hypot(ox-x,oy-y)+(k==='props'?.05:0); if(d<bd){ bd=d; best=o; } if(all&&d<R) hits.push(o); } }
  return all?hits:best; }
function inBox(x0,y0,x1,y1){ const a=Math.min(x0,x1),b=Math.min(y0,y1),c=Math.max(x0,x1),d=Math.max(y0,y1), out=[]; for(const k of KINDS){ if(!LAY[k].v||LAY[k].l) continue; for(const o of ED[k]){ const [x,y]=objPos(o,k); if(x>=a&&x<=c&&y>=b&&y<=d) out.push(o); } } return out; }
function baseAt(x,y){ const R=Math.max(.8,9/VIEW.z); for(const n of W.npcs) if(Math.hypot(n.x+.5-x,n.y+.5-y)<R) return {t:'NPC',n:n.name+(n.title?' ‹'+n.title+'›':'')}; for(const p of W.pois) if(Math.hypot(p.x+.5-x,p.y+.5-y)<R) return {t:'Landmark',n:p.name}; for(const m of W.mobs) if(Math.hypot(m[1]+.5-x,m[2]+.5-y)<R*.8) return {t:'Monster',n:mobName(m[0])}; return null; }

/* ---------- mouse ---------- */
let spaceDown=false;
cv.addEventListener('contextmenu',e=>e.preventDefault());
cv.addEventListener('pointerdown',e=>{ if(!W||dlgOpen) return; closeMenus(); hideCtx(); cv.setPointerCapture(e.pointerId); const [x,y]=toW(e.offsetX,e.offsetY), tx=Math.floor(x), ty=Math.floor(y);
  if(e.button===1||e.button===2||spaceDown||ST.tool==='pan'){ drag={k:'pan',sx:e.offsetX,sy:e.offsetY,vx:VIEW.x,vy:VIEW.y,btn:e.button,moved:false}; cv.style.cursor='grabbing'; return; }
  if(e.button!==0) return;
  if(pasteMode){ pasteAt(tx-Math.floor(clip.w/2),ty-Math.floor(clip.h/2)); if(!e.shiftKey){ pasteMode=false; setTool('select'); } return; }
  const t=ST.tool;
  if((t==='brush'||t==='line'||t==='rect'||t==='fill')&&e.altKey){ eyedrop(tx,ty,true); return; }
  if(t==='select'){ const o=pick(x,y);
    if(o){ if(e.shiftKey||e.ctrlKey||e.metaKey){ if(sel.has(o)) sel.delete(o); else sel.add(o); setSel([...sel]); return; } if(!sel.has(o)) setSel([o]); selRect=null;
      begin(e.altKey?'Copy and move':(sel.size>1?`Move ${sel.size} objects`:'Move '+objName(o)));
      if(e.altKey){ const cp=[]; for(const q of sel){ const k=kindOf(q), c=cloneObj(q); if(k==='npcs') c.name=uniqueName(c.name); ED[k].push(c); cp.push(c); } sel=new Set(cp); }
      drag={k:'move',x0:x,y0:y,start:[...sel].map(q=>[q,q.x,q.y,kindOf(q)]),moved:false}; return; }
    drag={k:'marquee',x0:x,y0:y,x1:x,y1:y,add:e.shiftKey}; return; }
  if(t==='brush'){ begin(ST.layer==='zone'?'Paint zone':'Paint '+(TDESC[ST.tile]||ST.tile)); paintCells(brushCells(tx,ty,ST.brush,ST.shape)); drag={k:'paint',lx:tx,ly:ty}; return; }
  if(t==='erase'){ begin('Erase'); eraseCells(brushCells(tx,ty,ST.brush,ST.shape),x,y); drag={k:'erase',lx:tx,ly:ty}; return; }
  if(t==='line'){ drag={k:'line',x0:tx,y0:ty}; return; }
  if(t==='rect'){ drag={k:'rect',x0:tx,y0:ty}; return; }
  if(t==='measure'){ drag={k:'measure',x0:x,y0:y}; return; }
  if(t==='fill'){ begin(ST.layer==='zone'?'Fill zone':'Fill '+(TDESC[ST.tile]||ST.tile)); floodFill(tx,ty); end(); return; }
  if(t==='pick'){ eyedrop(tx,ty); return; }
  if(!inMap(tx,ty)) return;
  if(t==='prop'){ begin(ST.scatter?'Scatter '+PROPS[ST.prop][1]:'Place '+PROPS[ST.prop][1]); if(ST.scatter){ scatter(x,y); drag={k:'scatter',lx:x,ly:y}; } else { placeProp(...snapP([x,y])); end(); } draw(); return; }
  if(t==='npc'){ begin('Add NPC'); const n={name:uniqueName('New villager'),title:'',x:tx,y:ty,col:NPCCOL[ED.npcs.length%NPCCOL.length],say:''}; ED.npcs.push(n); end(); setTool('select'); setSel([n]); focusField('iName'); return; }
  if(t==='spawn'){ begin('Add '+mobName(ST.mob)); const s={mob:ST.mob,x:tx,y:ty,n:ST.n}; ED.spawns.push(s); end(); draw(); return; }
  if(t==='poi'){ begin('Add landmark'); const p={name:'New landmark',x:tx,y:ty,r:5}; ED.pois.push(p); end(); setTool('select'); setSel([p]); focusField('iName'); return; } });
function scatter(x,y){ const R=Math.max(1,ST.brush), n=Math.max(1,Math.round(ST.density*R*R*.12)); for(let i=0;i<n;i++){ const a=Math.random()*6.283, r=Math.sqrt(Math.random())*R, px=x+Math.cos(a)*r, py=y+Math.sin(a)*r;
  if(!inMap(Math.floor(px),Math.floor(py))||tileAt(Math.floor(px),Math.floor(py))==='WATER') continue; const md=.9/Math.sqrt(ST.density/4); if(ED.props.some(p=>Math.abs(p.x-px)<md&&Math.abs(p.y-py)<md)) continue; if(!placeProp(...snapP([px,py]))) break; } }
function eyedrop(tx,ty,stay){ if(!inMap(tx,ty)) return; const t=tileAt(tx,ty), z=zoneAt(tx,ty); if(TDESC[t]) ST.tile=t; if(z&&(W.zones[z]||z==='town')) ST.zone=z; savePrefs(); toast(`Picked ${TDESC[t]||t} · ${zoneName(z)}`); if(!stay) setTool(lastTool==='pick'?'brush':lastTool); else { buildOptbar(); renderTop(); } }
addEventListener('pointermove',e=>{ if(!W) return; const r=cv.getBoundingClientRect(), mx=e.clientX-r.left, my=e.clientY-r.top, inside=mx>=0&&my>=0&&mx<CW&&my<CH;
  hover=inside||drag?toW(mx,my):null; const x=hover?hover[0]:0, y=hover?hover[1]:0, tx=Math.floor(x), ty=Math.floor(y);
  if(drag&&drag.k==='pan'){ if(Math.abs(mx-drag.sx)+Math.abs(my-drag.sy)>3) drag.moved=true; VIEW.x=drag.vx-(mx-drag.sx)/VIEW.z; VIEW.y=drag.vy-(my-drag.sy)/VIEW.z; }
  else if(drag&&drag.k==='paint'){ for(const [cx,cy] of lineCells(drag.lx,drag.ly,tx,ty)) paintCells(brushCells(cx,cy,ST.brush,ST.shape)); drag.lx=tx; drag.ly=ty; }
  else if(drag&&drag.k==='erase'){ for(const [cx,cy] of lineCells(drag.lx,drag.ly,tx,ty)) eraseCells(brushCells(cx,cy,ST.brush,ST.shape),cx+.5,cy+.5); eraseCells([],x,y); drag.lx=tx; drag.ly=ty; }
  else if(drag&&drag.k==='scatter'){ if(Math.hypot(x-drag.lx,y-drag.ly)>Math.max(.8,ST.brush*.6)){ scatter(x,y); drag.lx=x; drag.ly=y; } }
  else if(drag&&drag.k==='marquee'){ drag.x1=x; drag.y1=y; }
  else if(drag&&drag.k==='move'){ let dx=x-drag.x0, dy=y-drag.y0; if(Math.abs(dx)+Math.abs(dy)>.15) drag.moved=true;
    for(const [o,ox,oy,k] of drag.start){ if(k==='props'){ const p=snapP([ox+dx,oy+dy]); o.x=clamp(p[0],1,W.MW-1); o.y=clamp(p[1],1,W.OWH-1); } else { o.x=clamp(Math.round(ox+dx),1,W.MW-2); o.y=clamp(Math.round(oy+dy),1,W.OWH-2); } } }
  // hover feedback
  const tip=$('hoverTip'); hoverObj=null;
  if(hover&&inside&&!drag&&!dlgOpen){ hoverObj=ST.tool==='select'||ST.tool==='erase'?pick(x,y):null; const b=hoverObj?null:baseAt(x,y);
    if(hoverObj||b){ tip.style.display='block'; tip.innerHTML=hoverObj?`<small>${KN[kindOf(hoverObj)]}</small>${esc(objName(hoverObj))}`:`<small>${b.t} · original world</small>${esc(b.n)}`; tip.style.left=(mx+16)+'px'; tip.style.top=(my+14)+'px'; } else tip.style.display='none'; }
  else tip.style.display='none';
  if(hover&&tx>=0&&ty>=0&&tx<W.MW&&ty<W.OWH){ const t=tileAt(tx,ty), z=zoneAt(tx,ty), ed=ED.tiles[tx+','+ty]!==undefined;
    $('stPos').innerHTML=`<span style="color:var(--tx)">${String(tx).padStart(3,' ')}, ${String(ty).padStart(3,' ')}</span><i class="sw" style="width:10px;height:10px;background:${TCOL[t]}"></i><span style="font-family:var(--font)">${esc(TDESC[t]||t)}${ed?' <span style="color:var(--ac)">●</span>':''} · ${esc(zoneName(z))}</span>`; } else if(hover) $('stPos').textContent='Outside the map';
  if(hover||drag) draw(); });
addEventListener('pointerup',e=>{ if(!drag) return; const d=drag; drag=null; const [x,y]=hover||[0,0], tx=Math.floor(x), ty=Math.floor(y);
  if(d.k==='pan'){ cv.style.cursor=ST.tool==='pan'||spaceDown?'grab':ST.tool==='select'?'default':'crosshair'; if(d.btn===2&&!d.moved) openCtx(e.clientX,e.clientY,x,y); }
  else if(d.k==='paint'||d.k==='erase'||d.k==='scatter') end();
  else if(d.k==='move'){ if(!d.moved&&pending&&!pending.label.startsWith('Copy')) pending=null; else end(); renderRight(); }
  else if(d.k==='marquee'){ const small=Math.abs(d.x1-d.x0)*VIEW.z<4&&Math.abs(d.y1-d.y0)*VIEW.z<4;
    if(small){ selRect=null; if(!d.add) setSel([]); }
    else { const L=inBox(d.x0,d.y0,d.x1,d.y1); selRect={x0:clamp(Math.floor(Math.min(d.x0,d.x1)),0,W.MW-1),y0:clamp(Math.floor(Math.min(d.y0,d.y1)),0,W.OWH-1),x1:clamp(Math.floor(Math.max(d.x0,d.x1)),0,W.MW-1),y1:clamp(Math.floor(Math.max(d.y0,d.y1)),0,W.OWH-1)}; setSel(L,d.add); } }

  const L=[...sel]; if(L.length>1){ const by={}; for(const o of L){ const k=kindOf(o); by[k]=(by[k]||0)+1; } const props=L.filter(o=>ED.props.includes(o));
    return sec('multi',`${L.length} objects`,Object.entries(by).map(([k,n])=>`<div class="kv"><span>${n===1?KN[k]:KNP[k]}</span><b>${n}</b></div>`).join('')+actRow())
      +(props.length?sec('mprops','Props',prow('Scale',`<div class="rr"><input type="range" id="mS" min="40" max="250" step="5" value="100"><span class="mono" id="mSv" style="width:64px;color:var(--tx2)">×1.00</span></div>`)+`<div class="acts"><button class="btn sm" id="mRR">Random rotation</button><button class="btn sm" id="mRS">Vary sizes</button><button class="btn sm" id="mR0">Reset rotation</button></div>`):'')
      +sec('mhelp','Tips','<p class="hint">Arrow keys nudge the selection (Shift: 5 tiles). R rotates props. Alt-drag on the map makes a copy.</p>'); }
  const o=L[0], k=kindOf(o), head=`<div style="display:flex;align-items:center;gap:8px;padding:12px 12px 10px;border-bottom:1px solid var(--bd)"><span style="width:30px;height:30px;border-radius:7px;background:var(--acbg);color:var(--ac);display:grid;place-items:center;flex:none;font-size:17px">${k==='props'?(PROPS[o.k]||['?'])[0]:I(KIC[k])}</span><div style="min-width:0"><div style="font-weight:600;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(objName(o,k))}</div><div style="color:var(--tx3)">${KN[k]} · <span class="mono">${Math.floor(o.x)}, ${Math.floor(o.y)}</span></div></div></div>`;

      +sec('pty','Prop',prow('Type',`<select class="inp" id="iK">${Object.keys(PROPS).filter(x=>W.props.includes(x)).map(x=>`<option value="${x}" ${o.k===x?'selected':''}>${PROPS[x][0]}  ${PROPS[x][1]}</option>`).join('')}</select>`)+`<p class="hint">${SOLIDPROP.has(o.k)?'Solid: players and monsters walk around it.':'Decoration: players walk through it.'}</p>`); }
  else if(k==='npcs'){ const bad=solidAt(o.x+.5,o.y+.5);
    h+=sec('nid','Identity',prow('Name',`<input class="inp" type="text" id="iName" maxlength="28" value="${esc(o.name)}">`)+prow('Title',`<input class="inp" type="text" id="iTitle" maxlength="28" placeholder="e.g. Blacksmith" value="${esc(o.title||'')}">`)
        +prow('Colour',`<div style="display:flex;gap:8px;align-items:center"><input class="inp" type="color" id="iCol" value="${o.col||'#8a7a5a'}"><span class="mono" style="color:var(--tx3)">${esc(o.col||'#8a7a5a')}</span></div><div class="swatches">${NPCCOL.map(c=>`<span data-c="${c}" style="background:${c}"></span>`).join('')}</div>`,1))
      +sec('ntr','Transform',xy(false,o)+(bad?`<div class="note">${I('warn','s')}<span>This spot is blocked. The game moves the NPC to the nearest open tile.</span></div>`:''))
      +sec('nsay','Dialogue',`<textarea class="inp" id="iSay" rows="5" maxlength="240" placeholder="What the NPC says when a player talks to it">${esc(o.say||'')}</textarea><div class="hint mono" id="iSayN" style="text-align:right;margin:4px 0 0">${(o.say||'').length}/240</div>`); }
  else if(k==='spawns'){ const mt=W.mobByKey[o.mob], bad=solidAt(o.x+.5,o.y+.5);
    h+=sec('sm','Spawn',prow('Monster',`<select class="inp" id="iMob">${W.mobTypes.slice().sort((a,b)=>a.lv[0]-b.lv[0]).map(x=>`<option value="${x.key}" ${o.mob===x.key?'selected':''}>${esc(x.name)} (Lv ${x.lv[0]}–${x.lv[1]})</option>`).join('')}</select>`)
        +prow('Group size',`<div class="rr"><input type="range" id="iNr" min="1" max="12" value="${o.n}">${num('iN',o.n,1,1,12)}</div>`)
        +(mt?`<div class="kv"><span>Level</span><b>${mt.lv[0]}–${mt.lv[1]}</b></div><div class="kv"><span>Usual zone</span><b style="font-family:var(--font)">${esc(zoneName(mt.zone)||'any')}</b></div><div class="kv"><span>Zone here</span><b style="font-family:var(--font)">${esc(zoneName(zoneAt(o.x,o.y)))}</b></div>`:`<div class="note err">${I('err','s')}<span>Unknown monster: the game will skip this group.</span></div>`))
      +sec('str','Transform',xy(false,o)+(bad?`<div class="note">${I('warn','s')}<span>The centre is blocked. Monsters that land on blocked ground are skipped.</span></div>`:'')); }
  else if(k==='pois'){ h+=sec('lm','Landmark',prow('Name',`<input class="inp" type="text" id="iName" maxlength="30" value="${esc(o.name)}">`)+prow('Radius',`<div class="rr"><input type="range" id="iRadr" min="2" max="20" value="${o.r||5}">${num('iRad',o.r||5,1,2,20)}</div>`)+(o.name?'':`<div class="note err">${I('err','s')}<span>A landmark without a name is skipped by the game.</span></div>`))
      +sec('ltr','Transform',xy(false,o)); }
  return h+`<div style="padding:10px 12px">${actRow()}</div>`; }
function toolInspector(){ const t=ST.tool, T=toolById(t);
  let h=`<div style="display:flex;align-items:center;gap:10px;padding:12px;border-bottom:1px solid var(--bd)"><span style="width:30px;height:30px;border-radius:7px;background:var(--acbg);color:var(--ac);display:grid;place-items:center">${svg(t)}</span><div><div style="font-weight:600;font-size:13px">${T.name} tool</div><div style="color:var(--tx3)">Press <kbd>${T.key}</kbd> to switch to it</div></div></div>`;

  if(t==='spawn'){ const mt=W.mobByKey[ST.mob]; h+=sec('tasset','Placing',`<div style="font-weight:600">${esc(mobName(ST.mob))} ×${ST.n}</div>${mt?`<div style="color:var(--tx3)">Level ${mt.lv[0]}–${mt.lv[1]}${mt.zone?' · '+esc(zoneName(mt.zone)):''}</div>`:''}`); }
  const p=LS.get('ef_editor_published',null);
  h+=sec('tworld','World',[['Painted tiles',Object.keys(ED.tiles).length],['Zone cells',Object.keys(ED.zones).length],...KINDS.map(k=>[KNP[k],ED[k].length])].map(([a,b])=>`<div class="kv"><span>${a}</span><b>${b}</b></div>`).join('')
    +`<div class="kv"><span>Last published</span><b style="font-family:var(--font)">${p?new Date(p.t).toLocaleString([], {month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'}):'never'}</b></div>`);
  h+=sec('trealm','Realm',`<div class="kv"><span>Address</span><b style="font-family:var(--font);overflow:hidden;text-overflow:ellipsis;max-width:170px">${esc(realmHost())}</b></div><div class="kv"><span>Status</span><b style="font-family:var(--font);color:${REALM.online?'var(--ok)':'var(--tx3)'}">${REALM.online?'Connected':'Not connected'}</b></div>${REALM.version?`<div class="kv"><span>Realm version</span><b>${esc(REALM.version)}</b></div>`:''}<div class="kv"><span>Editor world</span><b>${esc(W.game||'?')}</b></div><div class="acts"><button class="btn sm" id="tRealm">${I('link','s')}Change realm</button></div>`);
  return h; }
function bindInspector(){ if($('tRealm')) $('tRealm').onclick=()=>realmDlg(); if(!sel.size) return; const L=[...sel], o=L[0];
  const live=(id,label,apply,opts={})=>{ const e=$(id); if(!e) return; e.addEventListener('focus',()=>begin(label)); e.addEventListener('pointerdown',()=>{ if(!pending) begin(label); });
    e.addEventListener('input',()=>{ if(!pending) begin(label); apply(e.type==='number'||e.type==='range'?+e.value:e.value); if(opts.sync) opts.sync(); draw(); });
    e.addEventListener('change',()=>{ end(); if(opts.rerender) renderRight(); }); e.addEventListener('blur',()=>end()); };
  const pair=(a,b)=>({sync:()=>{ const A=$(a),B=$(b); if(document.activeElement===A) B.value=A.value; else A.value=B.value; }});
  const XY=isP=>{ live('iX','Move',v=>{ o.x=isP?clamp(v,1,W.MW-1):clamp(Math.round(v),1,W.MW-2); },{rerender:1}); live('iY','Move',v=>{ o.y=isP?clamp(v,1,W.OWH-1):clamp(Math.round(v),1,W.OWH-2); },{rerender:1}); };
  if(L.length===1){ const k=kindOf(o);
    if(k==='props'){ live('iK','Change prop',v=>o.k=v,{rerender:1}); XY(true); live('iRr','Rotate',v=>o.r=+(v*Math.PI/180).toFixed(3),pair('iRr','iR')); live('iR','Rotate',v=>o.r=+(((v%360)+360)%360*Math.PI/180).toFixed(3),pair('iR','iRr')); live('iSr','Scale',v=>o.s=clamp(v/100,.3,4),pair('iSr','iS')); live('iS','Scale',v=>o.s=clamp(v/100,.3,4),pair('iS','iSr')); }
    if(k==='npcs'){ live('iName','Rename NPC',v=>o.name=v.slice(0,28)); live('iTitle','Change title',v=>o.title=v.slice(0,28)); live('iCol','Change colour',v=>o.col=v); XY(false);
      live('iSay','Change dialogue',v=>{ o.say=v.slice(0,240); $('iSayN').textContent=o.say.length+'/240'; });
      $('rightBody').querySelectorAll('[data-c]').forEach(s=>s.onclick=()=>{ begin('Change colour'); o.col=s.dataset.c; end(); renderRight(); }); }
    if(k==='spawns'){ live('iMob','Change monster',v=>o.mob=v,{rerender:1}); live('iNr','Change group size',v=>o.n=clamp(v|0,1,12),pair('iNr','iN')); live('iN','Change group size',v=>o.n=clamp(v|0,1,12),pair('iN','iNr')); XY(false); }
    if(k==='pois'){ live('iName','Rename landmark',v=>o.name=v.slice(0,30)); live('iRadr','Change radius',v=>o.r=clamp(v|0,2,20),pair('iRadr','iRad')); live('iRad','Change radius',v=>o.r=clamp(v|0,2,20),pair('iRad','iRadr')); XY(false); } }
  else { const P=L.filter(q=>ED.props.includes(q));
    if($('mS')){ let s0=null; $('mS').addEventListener('pointerdown',()=>{ begin('Scale'); s0=P.map(p=>p.s||1); }); $('mS').addEventListener('input',e=>{ if(!s0){ begin('Scale'); s0=P.map(p=>p.s||1); } const f=e.target.value/100; P.forEach((p,i)=>p.s=clamp(+(s0[i]*f).toFixed(2),.3,4)); $('mSv').textContent='×'+f.toFixed(2); draw(); }); $('mS').addEventListener('change',()=>{ end(); s0=null; }); }
    const act=(id,label,f)=>{ const e=$(id); if(e) e.onclick=()=>{ begin(label); P.forEach(f); end(); }; };
    act('mRR','Random rotation',p=>p.r=+(Math.random()*6.283).toFixed(2)); act('mRS','Vary sizes',p=>p.s=clamp(+((p.s||1)*(.8+Math.random()*.4)).toFixed(2),.3,4)); act('mR0','Reset rotation',p=>p.r=0); }
  if($('iDup')) $('iDup').onclick=()=>duplicateSel(); if($('iZoom')) $('iZoom').onclick=frameSel; if($('iDel')) $('iDel').onclick=deleteSel; }

/* ---------- bottom dock: problems, history, output ---------- */
function renderBotTabs(){ const e=problems.filter(p=>p.sev==='err').length, w=problems.filter(p=>p.sev==='warn').length, n=problems.length;
  $('botTabs').innerHTML=ptab('prob','warn','Problems',ST.botTab,n?` <span class="badge ${e?'err':w?'warn':''}">${n}</span>`:'')+ptab('hist','hist','History',ST.botTab,undo.length?` <span class="badge">${undo.length}</span>`:'')+ptab('out','term','Output',ST.botTab)
   +`<span class="sp"></span><div class="acts">${ST.botTab==='prob'?`<button class="ib sm" id="bRe" data-tip="Check again">${I('check','s')}</button>`:''}${ST.botTab==='out'?`<button class="ib sm" id="bClr" data-tip="Clear output">${I('trash','s')}</button>`:''}<button class="ib sm" id="bClose" data-tip="Hide panel" data-key="${MOD}+J">${I('x','s')}</button></div>`;
  bindTabs('botTabs',k=>showBot(k)); $('bClose').onclick=()=>togglePanel('B'); if($('bRe')) $('bRe').onclick=()=>{ runChecks(); toast(problems.length?`${problems.length} item${problems.length>1?'s':''} to look at`:'No problems found',problems.length?0:'ok'); }; if($('bClr')) $('bClr').onclick=()=>{ OUT=[]; renderBottom(); }; }
function renderBottom(){ if(!W||!ST.showB) return; renderBotTabs(); const b=$('botBody'), atEnd=b.scrollTop+b.clientHeight>=b.scrollHeight-4, st=b.scrollTop;
  if(ST.botTab==='prob') b.innerHTML=problems.length?`<div class="tree blist">${problems.map((p,i)=>`<div class="tr" data-i="${i}"><span class="sev ${p.sev}">${I(p.sev==='err'?'err':p.sev==='warn'?'warn':'info','s')}</span><span class="nm">${esc(p.msg)}</span><span class="xy mono">${Math.floor(p.x)},${Math.floor(p.y)}</span></div>`).join('')}</div>`:`<div class="empty">${I('check')}No problems. Everything you placed will load in the game.</div>`;
  else if(ST.botTab==='hist') b.innerHTML=`<div class="tree blist"><div class="tr" data-h="0"><span class="sev">${I('map','s')}</span><span class="nm" style="color:var(--tx3)">Opened the editor</span></div>${undo.map((u,i)=>`<div class="tr" data-h="${i+1}"><span class="sev" style="color:var(--tx3)">${I('hist','s')}</span><span class="nm">${esc(u.label)}</span><span class="xy mono">${new Date(u.t).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit',second:'2-digit'})}</span></div>`).join('')}<div class="tr on" style="cursor:default"><span class="sev" style="color:var(--ac)">${I('play','s')}</span><span class="nm">Current state</span></div>${redo.slice().reverse().map((r,i)=>`<div class="tr dim" data-h="${undo.length+i+1}"><span class="sev">${I('redo','s')}</span><span class="nm">${esc(r.label)}</span><span class="xy">undone</span></div>`).join('')}</div>`;
  else b.innerHTML=`<div class="out" style="padding:4px 0">${OUT.map(l=>`<div class="ln ${l.kind}"><span class="t">${l.t.toLocaleTimeString([], {hour12:false})}</span><span>${esc(l.msg)}</span></div>`).join('')||'<div class="empty">Nothing yet.</div>'}</div>`;
  b.querySelectorAll('.tr[data-i]').forEach(r=>r.onclick=()=>{ const p=problems[+r.dataset.i]; if(p.obj){ if(ST.tool!=='select') setTool('select',true); setSel([p.obj]); } centerOn(p.x,p.y,Math.max(VIEW.z,12)); });
  b.querySelectorAll('.tr[data-h]').forEach(r=>r.onclick=()=>jumpHistory(+r.dataset.h));
  b.scrollTop=ST.botTab==='out'&&atEnd?b.scrollHeight:st; }

/* ---------- problems: things the game would skip or that would play badly ---------- */
function runChecks(){ if(!W) return; const P=[], add=(sev,msg,x,y,obj)=>P.push({sev,msg,x,y,obj});
  const names=new Map(); for(const n of ED.npcs){ const id=String(n.name||'Villager').toLowerCase().replace(/[^a-z0-9]+/g,'').slice(0,20); if(names.has(id)) add('err',`Two NPCs are called "${n.name}". The game only loads the first one, so rename this one.`,n.x+.5,n.y+.5,n); else names.set(id,n);
    if(solidAt(n.x+.5,n.y+.5)) add('warn',`${n.name} stands on blocked ground. The game moves them to the nearest open tile.`,n.x+.5,n.y+.5,n); if(!n.say) add('info',`${n.name} has nothing to say yet.`,n.x+.5,n.y+.5,n); }
  for(const s of ED.spawns){ const mt=W.mobByKey[s.mob]; if(!mt) add('err',`Unknown monster "${s.mob}". The game skips this group.`,s.x+.5,s.y+.5,s);
    else if(solidAt(s.x+.5,s.y+.5)) add('warn',`${mt.name} ×${s.n} is placed on blocked ground. Monsters that land on blocked ground are skipped.`,s.x+.5,s.y+.5,s);
    if(zoneAt(s.x,s.y)==='town') add('warn',`${mobName(s.mob)} ×${s.n} is inside the town. They will attack players in town.`,s.x+.5,s.y+.5,s);
    if(mt&&mt.zone&&zoneAt(s.x,s.y)&&mt.zone!==zoneAt(s.x,s.y)&&zoneAt(s.x,s.y)!=='town') add('info',`${mt.name} usually lives in ${zoneName(mt.zone)}, but this group is in ${zoneName(zoneAt(s.x,s.y))}.`,s.x+.5,s.y+.5,s); }
  const pn=new Set(); for(const p of ED.pois){ if(!p.name) add('err','A landmark has no name. The game skips it.',p.x+.5,p.y+.5,p); else { const k=p.name.toLowerCase().replace(/[^a-z0-9]+/g,''); if(pn.has(k)||W.pois.some(b=>b.name.toLowerCase().replace(/[^a-z0-9]+/g,'')===k)) add('warn',`There is already a landmark called "${p.name}".`,p.x+.5,p.y+.5,p); pn.add(k); } }
  if(ED.props.length>MAXPROPS) add('err',`You have ${ED.props.length} props. The game only draws the first ${MAXPROPS}.`,ED.props[MAXPROPS].x,ED.props[MAXPROPS].y,ED.props[MAXPROPS]);
  let pw=0; for(const p of ED.props){ if(tileAt(Math.floor(p.x),Math.floor(p.y))==='WATER'&&SOLIDPROP.has(p.k)&&pw++<20) add('info',`A ${PROPS[p.k][1].toLowerCase()} stands in water. It is drawn, but does not block swimmers.`,p.x,p.y,p); }
  for(const n of W.npcs){ const t=ED.tiles[n.x+','+n.y]; if(t&&SOLID.has(t)) add('warn',`Your ${(TDESC[t]||t).toLowerCase()} covers ${n.name}. The game will move them to the nearest open tile.`,n.x+.5,n.y+.5,null); }
  const blockedTown=Object.entries(ED.tiles).filter(([k,t])=>SOLID.has(t)&&(()=>{ const [x,y]=k.split(',').map(Number); return Math.hypot(x-W.town.x,y-W.town.y)<4; })()).length; if(blockedTown) add('warn',`${blockedTown} blocking tile${blockedTown>1?'s are':' is'} right next to the town square, where new players arrive.`,W.town.x+.5,W.town.y+.5,null);
  const ord={err:0,warn:1,info:2}; problems=P.sort((a,b)=>ord[a.sev]-ord[b.sev]); renderBotTabs(); if(ST.botTab==='prob') renderBottom(); updateStatus(); }

/* ---------- status bar and the unpublished-changes marker ---------- */
function updateStatus(){ if(!W) return; $('stSel').textContent=sel.size?`${sel.size} selected`:''; $('stSel').classList.toggle('hidden',!sel.size); const n=editCount(); $('stEd').textContent=`${n} change${n===1?'':'s'}`; $('stEd').title='Everything you changed';
  const e=problems.filter(p=>p.sev==='err').length, w=problems.filter(p=>p.sev==='warn').length; $('stProb').innerHTML=`<span style="display:flex;gap:4px;align-items:center;color:${e?'var(--err)':'var(--tx2)'}">${I('err','s')}${e}</span><span style="display:flex;gap:4px;align-items:center;color:${w?'var(--warn)':'var(--tx2)'}">${I('warn','s')}${w}</span>`; $('stProb').title='Problems';
  if($('qUndo')){ $('qUndo').disabled=!undo.length; $('qRedo').disabled=!redo.length; } $('docName').textContent=LS.get('ef_editor_name','')||'Untitled world'; $('dtabName').textContent=(LS.get('ef_editor_name','')||'world').toLowerCase().replace(/\s+/g,'-')+'.js'; }
function sig(){ const s=JSON.stringify(exportData()); let h=5381; for(let i=0;i<s.length;i++) h=((h<<5)+h+s.charCodeAt(i))|0; return h+':'+s.length; }
function updateDirty(){ const p=LS.get('ef_editor_published',null), d=!!(editCount()||p)&&(!p||p.sig!==sig()); $('docTitle').classList.toggle('dirty',d); $('dtab').classList.toggle('dirty',d);
  $('docSrc').textContent=d?'· not published':p?'· published':''; $('docTitle').title=d?'You have changes that are not on the realm yet. Publish to put them live.':''; }
