# One-click deploy on Render.com: New → Blueprint → pick the repo that contains this folder.
services:
  - type: web
    name: emberfall
    runtime: node
    plan: free
    buildCommand: ""
    startCommand: node server.js
    healthCheckPath: /health
    envVars:
      - key: GM_PASSWORD
        sync: false   # Render asks you for the value: your secret owner password
      - key: OWNER_IP
        sync: false   # optional: your home IP, so you are the owner without logging in
